name: Development Environment Workflow

on:
  push:
    branches:
      - develop
      - fx/hardcoded-region
  workflow_dispatch:

jobs:
  debug-region:
    runs-on: ubuntu-latest
    steps:
      - name: Print AWS Region
        run: echo "AWS_REION = eu-west-1"
        # run: echo "AWS_REGION=${{ secrets.AWS_REGION }}"

  build:
    needs: debug-region
    uses: d-rec/drec-ui/.github/workflows/build-docker-ecr.yaml@develop
    with:
      environment: dev
    secrets:
      aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      aws-region: ${{ secrets.AWS_REGION}}
      ecr-registry: ${{ secrets.ECR_REGISTRY }}

  deploy:
    needs: build
    uses: d-rec/drec-ui/.github/workflows/deploy-ecr-k8s.yaml@develop
    with:
      environment: dev
    secrets:
      aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      aws-region: ${{ secrets.AWS_REGION}}
      ecr-registry: ${{ secrets.ECR_REGISTRY }}
