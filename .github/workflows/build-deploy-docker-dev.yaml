name: Development Environment Workflow

on:
  push:
    branches:
      - develop
      - ft/move-deployment-to-gh-actions
  workflow_dispatch:

jobs:
  build:
    uses: d-rec/drec-ui/.github/workflows/build-docker-ecr.yaml@ft/move-deployment-to-gh-actions
    with:
      environment: dev
    secrets:
      aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      aws-region: eu-west-1
      ecr-registry: ${{ secrets.ECR_REGISTRY }}

  deploy:
    needs: build
    uses: d-rec/drec-ui/.github/workflows/deploy-ecr-k8s.yaml@ft/move-deployment-to-gh-actions
    with:
      environment: dev
    secrets:
      aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      aws-region: eu-west-1
      ecr-registry: ${{ secrets.ECR_REGISTRY }}
