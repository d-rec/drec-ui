name: Cypress E2E Workflow
on:
  push:
    branches:
      - develop
      - stage
      - prod
  pull_request:
    branches:
      - develop
      - stage
      - prod
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MODE: test
      MNEMONIC: ${{ secrets.WALLET_MNEMONIC }}
      WEB3: https://volta-rpc.energyweb.org
      UI_BASE_URL: http://localhost:4200
      INFLUXDB_URL: http://localhost:8086
      INFLUXDB_TOKEN: admin:admin
      INFLUXDB_BUCKET: energy/autogen
      ISSUER_PRIVATE_KEY: ${{ secrets.ISSUER_PRIVATE_KEY }}
      CERTIFICATE_REGISTRY_ADDRESS: "0x8D4172D0a05860813155bebEF5b263BA9383BC4B"
      ISSUER_CONTRACT_ADDRESS: "0x3E6694fce3C675F82A28AaF9918aDA2787989c5f"
      DREC_BLOCKCHAIN_ADDRESS: "0xDeC1488838C65E355A9336eE8DdFc32665dB9222"
      CERTIFICATE_QUEUE_DELAY: 60000
      BACKEND_PORT: 3040
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: origin
      REACT_APP_BACKEND_URL: http://localhost:3040
      ADMIN_EMAIL: drec@energy.org
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      # --- AWS/LocalStack Environment Variables ---
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT: http://localhost:4566
      S3_BUCKET: mock-bucket
      # ------------------------------------------
    steps:
      - name: Set MODE based on branch
        id: set-env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/stage" ]]; then
            echo "MODE=stage" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == "refs/heads/prod" ]]; then
            echo "MODE=prod" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "MODE=dev" >> $GITHUB_ENV
          else
            # For pull requests or other branches
            echo "MODE=test" >> $GITHUB_ENV
          fi

      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Install pnpm and Rush globally
        run: |
          npm install -g pnpm @microsoft/rush

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          # Install python3-pip first, then awscli via pip
          sudo apt-get install -y influxdb-client docker-compose postgresql-client netcat-openbsd curl python3-pip
          pip3 install awscli
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/iron
          cache: npm

      - name: Clone Backend Repository
        run: |
          git clone https://github.com/d-rec/drec-origin.git projects/drec-origin
          chmod -R 777 projects/drec-origin

      # --- New LocalStack Setup Steps ---
      - name: Start LocalStack Container
        run: |
          echo "Pulling latest LocalStack image..."
          docker pull localstack/localstack:latest # Ensure the latest image is pulled
          echo "Stopping and removing any existing LocalStack container..."
          docker stop localstack || true # Stop if running, ignore error if not
          docker rm localstack || true   # Remove if exists, ignore error if not
          echo "Starting LocalStack container..."
          docker run -d -p 4566:4566 -p 4571:4571 --name localstack localstack/localstack:latest
          echo "Waiting for LocalStack to be ready (max 60 seconds)..."
          timeout=60
          elapsed=0
          # Wait for LocalStack's health endpoint to be accessible
          while ! curl -s http://localhost:4566/health >/dev/null; do
            sleep 5
            elapsed=$((elapsed+5))
            echo "LocalStack is not ready yet... ($elapsed seconds)"
            if [ "$elapsed" -ge "$timeout" ]; then
              echo "LocalStack failed to start within $timeout seconds. See logs below:"
              docker logs localstack # Output LocalStack logs for debugging
              exit 1
            fi
          done
          echo "LocalStack is ready!"

      - name: Create S3 Mock Bucket
        run: |
          echo "Creating S3 mock-bucket in LocalStack..."
          # The AWS_ENDPOINT environment variable configured above will direct this command to LocalStack
          aws s3 mb s3://mock-bucket
          echo "S3 mock-bucket created."
      # ----------------------------------
      - name: Start Docker Services (e.g., PostgreSQL, InfluxDB)
        working-directory: projects/drec-origin
        run: |
          echo "Starting docker-compose services..."
          # Removed '|| true' to ensure proper error propagation if docker-compose fails
          docker-compose up -d
          docker-compose logs --tail=100 # Show recent logs for debugging

      - name: Install Backend Dependencies using Rush
        working-directory: projects/drec-origin
        run: rush install

      - name: Debug - Verify Utility Files
        working-directory: projects/drec-origin/apps/drec-api
        run: |
          ls -R src/utils

      - name: Build Backend
        working-directory: projects/drec-origin
        run: rush build

      - name: Debug - Verify Build Output
        working-directory: projects/drec-origin/apps/drec-api
        run: |
          ls -R dist

      - name: Start Backend and Wait for Readiness
        working-directory: projects/drec-origin
        run: |
          echo "Starting backend in background..."
          rush start:dev &  # Start backend in the background
          echo "Waiting for backend to be ready (max 120 seconds)..."
          timeout=120
          elapsed=0
          while ! curl -s http://localhost:3040 >/dev/null; do
            sleep 10
            elapsed=$((elapsed+10))
            echo "Backend is not ready yet... ($elapsed seconds)"
            if [ "$elapsed" -ge "$timeout" ]; then
              echo "Backend failed to start within $timeout seconds."
              exit 1
            fi
          done
          echo "Backend is ready!"

      - name: Install and Start Frontend
        run: |
          echo "Installing frontend dependencies..."
          npm install
          echo "Starting frontend in background..."
          nohup npm run start &  # Start frontend in the background
          echo "Waiting for Frontend to be ready (max 60 seconds)..."
          timeout=60
          elapsed=0
          until curl -s http://localhost:4200; do
            sleep 5
            elapsed=$((elapsed+5))
            echo "Frontend is not ready yet... ($elapsed seconds)"
            if [ "$elapsed" -ge "$timeout" ]; then
              echo "Frontend failed to start within $timeout seconds."
              exit 1
            fi
          done
          echo "Frontend is ready!"
      - name: Run Cypress Tests
        run: pnpx cypress run

      - name: Upload Cypress Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots

      - name: Debug - Check parent directory before backend teardown
        run: |
          echo "Listing contents of 'projects/' directory:"
          ls -F projects/
          echo "Checking existence and permissions of 'projects/drec-origin':"
          ls -ld projects/drec-origin || true # Use || true to prevent this debug step from failing the workflow

      - name: Tear Down Docker Compose Environment
        working-directory: projects/drec-origin
        run: docker-compose down
        if: always() # Ensure this step always runs, even if previous steps fail

      - name: Clean up LocalStack Container
        run: |
          echo "Stopping LocalStack container..."
          docker stop localstack || true
          echo "Removing LocalStack container..."
          docker rm localstack || true
        if: always() # Ensure this step always runs for clean environment
