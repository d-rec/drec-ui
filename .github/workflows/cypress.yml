name: Run Cypress E2E Tests

on:
  push:
    branches:
      - ft/register-new-account  # Trigger on push to this branch
  pull_request:
    branches:
      - ft/register-new-account  # Trigger on pull requests to this branch

jobs:
  e2e:
    runs-on: ubuntu-latest

    services:
      webapp:
        image: ghcr.io/rithaven/drec-origin:latest  # This line can be omitted if you're building the image locally
        ports:
          - 4200:4200  # Exposing the frontend port
          - 3040:3040  # Exposing the backend port
        options: --health-cmd="curl --fail http://localhost:4200/health || exit 1" --health-interval=30s --health  # Health check for the frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v2  # Check out the repository

      - name: Log in to Docker Hub or GHCR
        uses: docker/login-action@v2  # Log in to Docker registry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}  # Assuming you're using GitHub Container Registry

      - name: Build backend Docker image
        run: |
          docker build -t ghcr.io/rithaven/drec-origin:latest ./d-rec/drec-origin  # Build Docker image from the backend directory

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '18'  # Set up Node.js version 18

      - name: Install dependencies
        run: |
          npm install  # Install project dependencies
          npm install cypress  # Install Cypress for E2E tests

      - name: Run Cypress tests
        run: npm run e2e  # Run Cypress tests
