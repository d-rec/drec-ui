name: CI Workflow

on:
  push:
    branches:
      - ft/register-new-account
  pull_request:
    branches:
      - ft/register-new-account

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the main repository
      - name: Checkout main repository
        uses: actions/checkout@v2

      # 2. Clone the backend repository
      - name: Clone backend repository
        run: |
          git clone --branch ft/register-new-account https://github.com/d-rec/drec-origin.git projects/drec-origin
          echo "Backend repository cloned successfully."

      # 3. Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '20'

      # 4. Install Rush and pnpm globally
      - name: Install Rush and pnpm
        run: |
          npm install -g @microsoft/rush pnpm
          echo "Rush and pnpm installed successfully."

      # 5. Set up Docker
      - name: Set up Docker
        run: |
          sudo apt-get update
          sudo apt-get remove -y containerd  # Remove any conflicting package
          sudo apt-get install -y apt-transport-https ca-certificates curl software-properties-common
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y docker-ce docker-ce-cli containerd.io
          sudo systemctl enable docker
          sudo systemctl start docker
          docker --version
          echo "Docker set up successfully."

      # 6. Install backend dependencies
      - name: Install backend dependencies
        working-directory: projects/drec-origin
        run: |
          rush install
          echo "Backend dependencies installed successfully."

      # 7. Build the backend
      - name: Build backend
        working-directory: projects/drec-origin
        run: |
          rush build
          echo "Backend built successfully."

      # 8. Start the backend server
      - name: Start backend server
        working-directory: projects/drec-origin
        run: |
          nohup rush start:dev &  # Start the backend in the background
          sleep 30  # Allow time for the server to initialize
          echo "Backend server started successfully."

      # 9. Verify backend server is running
      - name: Verify backend server is running
        run: |
          set -e
          timeout 120 bash -c "until curl -s http://localhost:3040; do echo 'Waiting for backend server to start...'; sleep 5; done"
          echo "Backend server is running."

      # 10. Clear the database
      - name: Clear database
        run: |
          curl -X DELETE http://localhost:3040/api/testing/clear-db
          echo "Database cleared successfully."

      # 11. Install frontend dependencies
      - name: Install frontend dependencies
        working-directory: projects/drec-ui
        run: |
          npm install
          echo "Frontend dependencies installed successfully."

      # 12. Run frontend tests
      - name: Run frontend tests
        working-directory: projects/drec-ui
        run: |
          npm test
          echo "Frontend tests completed successfully."
