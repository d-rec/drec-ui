name: Cypress Tests

on:
  push:
    branches:
      - main  # Run tests on pushes to the main branch
  pull_request:
    branches:
      - main  # Run tests on pull requests to the main branch

jobs:
  cypress:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '16'

    - name: Install dependencies
      run: |
        npm install
        npm install cypress --save-dev

    - name: Run Cypress tests
      run: npm run test:e2e  # Ensure you have this script in your package.json

    - name: Upload Cypress videos and screenshots
      if: always()
      uses: cypress-io/github-action@v2
      with:
        record: true
        group: 'e2e-tests'
        parallel: true
