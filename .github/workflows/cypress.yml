name: CI Workflow

on:
  push:
    branches:
      - ft/register-new-account
  pull_request:
    branches:
      - ft/register-new-account

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Main Repository
        uses: actions/checkout@v2

      - name: Clone Backend Repository
        run: |
          git clone --branch ft/register-new-account https://github.com/d-rec/drec-origin.git projects/drec-origin

      - name: Install Rush and pnpm globally
        run: |
          npm install -g @microsoft/rush pnpm

      - name: Install Backend Dependencies (Rush Install)
        working-directory: projects/drec-origin
        run: |
          rush install

      - name: Install ts-node in Backend Workspace
        working-directory: projects/drec-origin/apps/drec-api
        run: |
          pnpm add ts-node tsconfig-paths typeorm --save-dev

      - name: Set environment variables for testing
        run: |
          echo "MNEMONIC=${{ secrets.MNEMONIC }}" >> $GITHUB_ENV
          echo "PRIVATE_KEY=${{ secrets.PRIVATE_KEY }}" >> $GITHUB_ENV

      - name: Install Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      - name: Build and Start Docker Services
        working-directory: projects/drec-origin
        run: |
          docker compose -f docker-compose.yml up --build -d

      - name: Start Backend (rush start:dev)
        working-directory: projects/drec-origin
        run: |
          rush start:dev

      - name: Install Frontend Dependencies
        working-directory: projects/drec-ui
        run: |
          npm install

      - name: Install Cypress Dependencies
        working-directory: cypress
        run: |
          npm install

      - name: Run Cypress Tests
        run: |
          npx cypress run --config-file=cypress.config.ts

      - name: Tear Down Docker Compose Environment
        working-directory: projects/drec-origin
        run: |
          docker compose down
