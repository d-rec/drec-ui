name: CI Workflow

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up environment
      run: |
        pnpm install
        # If required, set environment variables
        export PORT=3040

    - name: Start the server
      run: |
        npm run start &  # Or your command to start the backend
        sleep 5  # Wait for the server to initialize

    - name: Clear DB (via curl)
      run: |
        curl -X DELETE http://localhost:3040/api/testing/clear-db

    - name: Run tests
      run: pnpm test
