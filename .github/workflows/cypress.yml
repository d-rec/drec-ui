name: Run Cypress E2E Tests

on:
  push:
    branches:
      - ft/register-new-account  # Trigger on push to this branch
  pull_request:
    branches:
      - ft/register-new-account  # Trigger on pull requests to this branch

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out repository
      - name: Check out repository
        uses: actions/checkout@v2

      # Step 2: Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '18'

      # Step 3: Build and start the backend
      - name: Start backend
        run: |
          cd ./d-rec/drec-origin
          npm install
          npm run build  # Assuming you have a build step
          npm start &  # Start backend in the background

      # Step 4: Start the frontend
      - name: Start frontend
        run: |
          cd ./frontend  # Adjust path to your frontend directory
          npm install
          npm start &  # Start frontend in the background

      # Step 5: Wait for services to start
      - name: Wait for services
        run: sleep 20  # Adjust the delay if necessary

      # Step 6: Install Cypress dependencies
      - name: Install Cypress dependencies
        run: |
          npm install cypress

      # Step 7: Run Cypress tests
      - name: Run Cypress tests
        run: npm run e2e
