name: Run Cypress E2E Tests

on:
  push:
    branches:
      - ft/register-new-account  # Trigger on push to this branch
  pull_request:
    branches:
      - ft/register-new-account  # Trigger on pull requests to this branch

jobs:
  e2e:
    runs-on: ubuntu-latest

    services:
      webapp:
        # If you're building the image locally from the drec-origin directory, you can use the build context.
        # Build Docker image locally (assuming you're in the root directory and the backend is in /d-rec/drec-origin)
        build: ./d-rec/drec-origin  # Path to the backend Dockerfile
        ports:
          - 4200:4200  # Exposing the frontend port
          - 3040:3040  # Exposing the backend port
        options: --health-cmd="curl --fail http://localhost:4200/health || exit 1" --health-interval=30s --health  # Health check for the frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v2  # Check out the repository

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2  # Log in to GitHub Container Registry
        with:
          username: ${{ github.actor }}  # Use the GitHub actor for authentication
          password: ${{ secrets.GHCR_TOKEN }}  # Use GHCR_TOKEN from GitHub Secrets

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '18'  # Set up Node.js version 18

      - name: Install dependencies
        run: |
          npm install  # Install project dependencies
          npm install cypress  # Install Cypress for E2E tests

      - name: Run Cypress tests
        run: npm run e2e  # Run Cypress tests

