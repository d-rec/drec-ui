name: Cypress CI Workflow

on:
  push:
    branches:
      - ft/register-new-account
  pull_request:
    branches:
      - ft/register-new-account

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      MODE: dev
      WEB3: https://volta-rpc.energyweb.org
      UI_BASE_URL: http://localhost:4200
      BACKEND_PORT: 3040
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: origin

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y influxdb-client docker-compose postgresql-client netcat

      - name: Setup Node.js
        run: |
          curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.1/install.sh | bash
          export NVM_DIR="$HOME/.nvm"
          . "$NVM_DIR/nvm.sh"
          nvm install 20.14.0
          nvm use 20.14.0

      - name: Install Rush and pnpm
        run: |
          npm install -g @microsoft/rush pnpm

      - name: Clone Backend Repository
        run: |
          git clone --branch ft/register-new-account https://github.com/d-rec/drec-origin.git projects/drec-origin
          chmod -R 777 projects/drec-origin

      - name: Start Docker Services
        working-directory: projects/drec-origin
        run: |
          docker-compose up -d  # Run Docker in detached mode
          docker-compose logs --tail=100  # Capture logs to help with debugging

      - name: Install Backend Dependencies
        working-directory: projects/drec-origin
        run: rush install

      - name: Build Backend
        working-directory: projects/drec-origin
        run: rush build

      - name: Start Backend
        working-directory: projects/drec-origin
        run: |
          nohup rush start:dev &  # Keep the backend process running in the background

      - name: Wait for Backend to Be Ready
        run: |
          echo "Waiting for backend to be fully ready..."
          RETRY_COUNT=0
          MAX_RETRIES=30  # Increased retries to handle slow startups
          BACKEND_HOST="drec-origin-backend"  # Use the Docker service name instead of localhost
          BACKEND_PORT="3040"  # Adjust as needed
          # Try to check if the port is open and the backend is responsive
          until nc -z -v -w30 $BACKEND_HOST $BACKEND_PORT; do
            RETRY_COUNT=$((RETRY_COUNT+1))
            if [ $RETRY_COUNT -ge $MAX_RETRIES ]; then
              echo "Backend did not start in time, exiting..."
              exit 1
            fi
            echo "Waiting for backend to be ready... Attempt $RETRY_COUNT of $MAX_RETRIES"
            sleep 15  # Increased sleep time to handle slow startup
          done
          echo "Backend is ready!"

      - name: Install and Start Frontend
        run: |
          npm install
          npm run start &

      - name: Run Cypress Tests
        run: npx cypress run

      - name: Tear Down Docker Environment
        working-directory: projects/drec-origin
        run: docker-compose down
