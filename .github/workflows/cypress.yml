# GitHub Actions Workflow
name: CI Workflow

on:
  push:
    branches:
      - ft/register-new-account
  pull_request:
    branches:
      - ft/register-new-account

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      # Environment variables
      MODE: dev
      WEB3: https://volta-rpc.energyweb.org
      UI_BASE_URL: http://localhost:4200
      DEBUG_API_KEY: debug
      BACKEND_PORT: 3040

      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: origin

      JWT_SECRET: thisisnotsecret
      JWT_EXPIRY_TIME: "7 days"
      MNEMONIC: "shine ability artefact river cabin copy blind hello gift hospital tenant region"
      ISSUER_PRIVATE_KEY: 4773097f508a6edd206150766ee25cb5abc1635f28f9cfd27e144872e89dc9c9
      DREC_BLOCKCHAIN_ADDRESS: "0xDeC1488838C65E355A9336eE8DdFc32665dB9222"
      CERTIFICATE_QUEUE_DELAY: 60000
      ADMIN_EMAIL: drec@energy.org
      ADMIN_PASSWORD: 1234Rc

    steps:
      # 1. Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v2
        with:
          repository: d-rec/drec-origin
          ref: ft/register-new-account # Checkout the specific branch

      # 2. Install Influx Client
      - name: Install Influx Client
        run: |
          sudo apt update
          sudo apt install -y influxdb-client
          echo "Influx client installed successfully."

      # 3. Install and Set Up NVM
      - name: Install and Set Up NVM
        run: |
          sudo wget -qO- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.1/install.sh | bash
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          nvm install 20.14.0
          nvm use 20.14.0
          echo "NVM installed and Node.js 20.14.0 configured."

      # 4. Install Global Dependencies
      - name: Install Global Dependencies
        run: |
          npm install -g @microsoft/rush pnpm
          echo "Rush and pnpm installed globally."

      # 5. Set Permissions
      - name: Set Permissions
        run: |
          chmod -R 777 .
          echo "Permissions updated."

      # 6. Start Docker Services
      - name: Start Docker Services
        working-directory: .
        run: |
          docker-compose up --build -d
          echo "Docker services started."

      # 7. Create PostgreSQL Database
      - name: Create PostgreSQL Database
        run: |
          sleep 10 # Wait for PostgreSQL to start
          psql -h localhost -p 5432 -U postgres -c "CREATE DATABASE origin"
          echo "PostgreSQL database created."

      # 8. Install Project Dependencies and Build
      - name: Install Dependencies and Build
        run: |
          rush install
          rush build
          echo "Dependencies installed and project built."

      # 9. Start Backend
      - name: Start Backend
        run: |
          rush start:dev &
          echo "Backend started in dev mode."

      # 10. Wait for Backend to Be Ready
      - name: Wait for Backend to Be Ready
        run: |
          sleep 30
          echo "Backend is now ready."

      # 11. Install Cypress Dependencies
      - name: Install Cypress Dependencies
        working-directory: cypress
        run: |
          npm install
          echo "Cypress dependencies installed successfully."

      # 12. Run Cypress Tests
      - name: Run Cypress Tests
        working-directory: cypress
        run: |
          npx cypress run --config-file=cypress.config.ts
          echo "Cypress tests executed."

      # 13. Tear Down Docker Services
      - name: Tear Down Docker Services
        run: |
          docker-compose down
          echo "Docker services stopped."
