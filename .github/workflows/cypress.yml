name: CI Workflow

on:
  push:
    branches:
      - ft/register-new-account
  pull_request:
    branches:
      - ft/register-new-account

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the main repository
      - name: Checkout main repository
        uses: actions/checkout@v2

      # 2. Clone the backend repository
      - name: Clone backend repository
        run: |
          set -e
          git clone --branch ft/register-new-account https://github.com/d-rec/drec-origin.git projects/drec-origin
          echo "Backend repository cloned successfully."

      # 3. Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '20'

      # 4. Install Rush and pnpm globally
      - name: Install Rush and pnpm
        run: |
          set -e
          npm install -g @microsoft/rush pnpm
          echo "Rush and pnpm installed successfully."

      # 5. Set up Docker Compose
      - name: Install Docker Compose
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y docker-compose
          echo "Docker Compose installed successfully."

      # 6. Create Docker Compose File
      - name: Create Docker Compose file
        run: |
          set -e
          printf "version: '3.8'\nservices:\n  postgres:\n    image: postgres:13\n    environment:\n      POSTGRES_USER: drec_user\n      POSTGRES_PASSWORD: password\n      POSTGRES_DB: drec_db\n    ports:\n      - '5432:5432'\n  backend:\n    build: projects/drec-origin\n    ports:\n      - '3000:3000'\n    environment:\n      DB_HOST=postgres\n      DB_PORT=5432\n      DB_USERNAME=drec_user\n      DB_PASSWORD=password\n      DB_DATABASE=drec_db\n    depends_on:\n      - postgres\nnetworks:\n  default:\n    driver: bridge\n" > docker-compose.yml
          echo "Docker Compose file created."

      # 7. Build and Start Services using Docker Compose
      - name: Build and Start Services
        run: |
          set -e
          docker compose up --build
          echo "Docker services built and started."

      # 8. Wait for PostgreSQL and Backend to be Ready
      - name: Wait for services to be ready
        run: |
          set -e
          echo "Waiting for PostgreSQL..."
          timeout 180 bash -c "until nc -z localhost 5432; do echo 'Waiting for PostgreSQL...'; sleep 5; done"
          echo "PostgreSQL is ready."

          echo "Waiting for Backend..."
          timeout 180 bash -c "until curl -s http://localhost:3000/health | grep 'OK'; do echo 'Waiting for backend...'; sleep 5; done"
          echo "Backend is ready."

      # 9. Install Cypress dependencies
      - name: Install Cypress dependencies
        working-directory: cypress
        run: |
          set -e
          npm install
          echo "Cypress dependencies installed successfully."

      # 10. Run Cypress tests
      - name: Run Cypress tests
        run: |
          set -e
          npx cypress run --config-file=cypress.config.ts
          echo "Cypress tests completed successfully."

      # 11. Tear down Docker Compose environment
      - name: Tear down Docker Compose
        run: |
          set -e
          docker-compose down
          echo "Docker Compose environment torn down."
