name: Cypress E2E Workflow
on:
  push:
    branches:
      - develop
      - stage
      - prod
  pull_request:
    branches:
      - develop
      - stage
      - prod

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MODE: test
      MNEMONIC: ${{ secrets.WALLET_MNEMONIC }}
      WEB3: https://volta-rpc.energyweb.org
      UI_BASE_URL: http://localhost:4200
      INFLUXDB_URL: http://localhost:8086
      INFLUXDB_TOKEN: admin:admin
      INFLUXDB_BUCKET: energy/autogen
      ISSUER_PRIVATE_KEY: ${{ secrets.ISSUER_PRIVATE_KEY }}
      CERTIFICATE_REGISTRY_ADDRESS: "0x8D4172D0a05860813155bebEF5b263BA9383BC4B"
      ISSUER_CONTRACT_ADDRESS: "0x3E6694fce3C675F82A28AaF9918aDA2787989c5f"
      DREC_BLOCKCHAIN_ADDRESS: "0xDeC1488838C65E355A9336eE8DdFc32665dB9222"
      CERTIFICATE_QUEUE_DELAY: 60000
      BACKEND_PORT: 3040
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: origin
      REACT_APP_BACKEND_URL: http://localhost:3040
      ADMIN_EMAIL: drec@energy.org
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT: http://localhost:4566
      S3_BUCKET: mock-bucket

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Install pnpm and Rush globally
        run: |
          npm install -g pnpm @microsoft/rush

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y influxdb-client docker-compose postgresql-client netcat-openbsd curl python3-pip
          pip3 install awscli

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/iron
          cache: npm

      - name: Clone Backend Repository
        run: |
          git clone https://github.com/d-rec/drec-origin.git projects/drec-origin
          chmod -R 777 projects/drec-origin

      - name: Patch Backend FileService for LocalStack
        working-directory: projects/drec-origin/apps/drec-api/src/pods/file
        run: |
          FILE_PATH="file.service.ts"
          echo "Patching ${FILE_PATH} for LocalStack compatibility..."
          sed -i 's/process.env.bucketname/process.env.S3_BUCKET/g' "$FILE_PATH"
          sed -i 's/accessKeyId: process.env.accessKeyId/accessKeyId: process.env.AWS_ACCESS_KEY_ID/g' "$FILE_PATH"
          sed -i 's/secretAccessKey: process.env.secretAccessKey/secretAccessKey: process.env.AWS_SECRET_ACCESS_KEY/g' "$FILE_PATH"
          sed -i '/secretAccessKey: process.env.AWS_SECRET_ACCESS_KEY,/a \ \ \ \ \ \ region: process.env.AWS_REGION,\n\ \ \ \ \ \ endpoint: process.env.AWS_ENDPOINT,\n\ \ \ \ \ \ s3ForcePathStyle: true,' "$FILE_PATH"
          cat "$FILE_PATH" | grep -E 'AWS_ACCESS_KEY_ID|AWS_SECRET_ACCESS_KEY|AWS_REGION|AWS_ENDPOINT|S3_BUCKET|s3ForcePathStyle' || true

      - name: Start LocalStack Container
        run: |
          docker pull localstack/localstack:latest
          docker stop localstack || true
          docker rm localstack || true
          docker run -d -p 4566:4566 -p 4571:4571 --name localstack localstack/localstack:latest
          timeout=60
          elapsed=0
          while ! curl -s http://localhost:4566/health >/dev/null; do
            sleep 5
            elapsed=$((elapsed+5))
            if [ "$elapsed" -ge "$timeout" ]; then
              docker logs localstack
              exit 1
            fi
          done
          sleep 10

      - name: Create S3 Mock Bucket
        run: |
          aws --endpoint-url=http://localhost:4566 s3 mb s3://mock-bucket --debug

      - name: Start Docker Services (e.g., PostgreSQL, InfluxDB)
        working-directory: projects/drec-origin
        run: |
          docker-compose up -d
          docker-compose logs --tail=100

      - name: Install Backend Dependencies using Rush
        working-directory: projects/drec-origin
        run: rush install

      - name: Build Backend
        working-directory: projects/drec-origin
        run: rush build

      - name: Start Backend and Wait for Readiness
        working-directory: projects/drec-origin
        run: |
          rush start:dev &
          timeout=120
          elapsed=0
          while ! curl -s http://localhost:3040 >/dev/null; do
            sleep 10
            elapsed=$((elapsed+10))
            if [ "$elapsed" -ge "$timeout" ]; then
              exit 1
            fi
          done

      - name: Install and Start Frontend
        run: |
          npm install
          nohup npm run start &
          timeout=60
          elapsed=0
          until curl -s http://localhost:4200; do
            sleep 5
            elapsed=$((elapsed+5))
            if [ "$elapsed" -ge "$timeout" ]; then
              exit 1
            fi
          done

      - name: Run Cypress Tests
        run: pnpx cypress run

      - name: Upload Cypress Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots

      - name: Tear Down Docker Compose Environment
        if: always()
        working-directory: projects/drec-origin
        run: docker-compose down

      - name: Clean up LocalStack Container
        if: always()
        run: |
          docker stop localstack || true
          docker rm localstack || true
