name: CI Workflow

on:
  push:
    branches:
      - ft/register-new-account
  pull_request:
    branches:
      - ft/register-new-account

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the main repository
      - name: Checkout Main Repository
        uses: actions/checkout@v2

      # 2. Clone the backend repository
      - name: Clone Backend Repository
        run: |
          git clone --branch ft/register-new-account https://github.com/d-rec/drec-origin.git projects/drec-origin
          echo "Backend repository cloned successfully."

      # 3. Set up Node.js
      - name: Set Up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '20'

      # 4. Install Rush and pnpm globally
      - name: Install Rush and pnpm
        run: |
          npm install -g @microsoft/rush pnpm
          echo "Rush and pnpm installed successfully."

      # 5. Install Docker Compose
      - name: Install Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker.io
          sudo apt-get install -y docker-compose-plugin
          echo "Docker Compose installed successfully."

      # 6. Verify Docker Installation
      - name: Verify Docker Installation
        run: |
          docker --version
          docker compose version

      # 7. Create Docker Compose File
      - name: Create Docker Compose File
        working-directory: projects/drec-origin
        run: |
          cat <<EOF > docker-compose.yml
          version: '3.8'
          services:
            postgres:
              image: postgres:13
              environment:
                POSTGRES_USER: drec_user
                POSTGRES_PASSWORD: password
                POSTGRES_DB: drec_db
              ports:
                - '5432:5432'

            backend:
              build:
                context: ./backend
                dockerfile: Dockerfile
              ports:
                - '3000:3000'
              environment:
                DB_HOST: postgres
                DB_PORT: 5432
                DB_USERNAME: drec_user
                DB_PASSWORD: password
                DB_DATABASE: drec_db
              depends_on:
                - postgres

          networks:
            default:
              driver: bridge
          EOF
          echo "Docker Compose file created in the backend folder."

      # 8. Build and Start Services
      - name: Build and Start Services
        working-directory: projects/drec-origin
        run: |
          docker compose up --build 
          echo "Docker services built and started."


      # 10. Install Cypress dependencies
      - name: Install Cypress Dependencies
        working-directory: cypress
        run: |
          npm install
          echo "Cypress dependencies installed successfully."

      # 11. Run Cypress Tests
      - name: Run Cypress Tests
        working-directory: cypress
        run: |
          npx cypress run --config-file=cypress.config.ts
          echo "Cypress tests completed successfully."

      # 12. Tear Down Docker Compose Environment
      - name: Tear Down Docker Compose Environment
        working-directory: projects/drec-origin
        run: |
          docker compose down
          echo "Docker Compose environment torn down."
