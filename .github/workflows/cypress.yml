name: CI Workflow

on:
  push:
    branches:
      - ft/register-new-account
  pull_request:
    branches:
      - ft/register-new-account

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the main repository
      - name: Checkout main repository
        uses: actions/checkout@v2

      # 2. Clone the backend repository
      - name: Clone backend repository
        run: |
          set -e
          git clone --branch ft/register-new-account https://github.com/d-rec/drec-origin.git projects/drec-origin
          echo "Backend repository cloned successfully."

      # 3. Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '20'

      # 4. Install Rush and pnpm globally
      - name: Install Rush and pnpm
        run: |
          set -e
          npm install -g @microsoft/rush pnpm
          echo "Rush and pnpm installed successfully."

      # 5. Install Docker Compose
      - name: Install Docker Compose
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y docker-compose
          echo "Docker Compose installed successfully."

      # 6. Set up PostgreSQL container using Docker Compose
      - name: Set up PostgreSQL container
        run: |
          set -e
          printf "version: '3'\nservices:\n  postgres:\n    image: postgres:13\n    environment:\n      POSTGRES_USER: drec_user\n      POSTGRES_PASSWORD: password\n      POSTGRES_DB: drec_db\n    ports:\n      - '5432:5432'\n    networks:\n      - dbnet\nnetworks:\n  dbnet:\n    driver: bridge\n" > docker-compose.yml
          docker-compose up -d
          echo "PostgreSQL container started successfully."

      # 7. Wait for PostgreSQL container to be ready
      - name: Wait for PostgreSQL to be ready
        run: |
          set -e
          echo "Waiting for PostgreSQL to be ready..."
          timeout 180 bash -c "until nc -z localhost 5432; do echo 'Waiting for PostgreSQL...'; sleep 5; done"
          echo "PostgreSQL is ready."

      # 8. Install backend dependencies
      - name: Install backend dependencies
        working-directory: projects/drec-origin
        run: |
          set -e
          rush install
          echo "Backend dependencies installed successfully."

      # 9. Build the backend
      - name: Build backend
        working-directory: projects/drec-origin
        run: |
          set -e
          rush build
          echo "Backend built successfully."

      # 10. Configure environment variables for DB
      - name: Configure environment variables
        working-directory: projects/drec-origin
        run: |
          set -e
          cat <<EOF > .env
          DB_HOST=postgres
          DB_PORT=5432
          DB_USERNAME=drec_user
          DB_PASSWORD=password
          DB_DATABASE=drec_db
          EOF
          echo "Environment variables configured successfully."

      # 11. Debugging: List directories to verify paths
      - name: Debug - List directories
        run: |
          set -e
          echo "Listing directory structure..."
          ls -R
          echo "Directory structure listed."

      # 12. Verify Cypress folder exists
      - name: Verify Cypress folder exists
        run: |
          set -e
          if [ ! -d "cypress" ]; then
            echo "Cypress folder not found at 'cypress'. Exiting."
            exit 1
          fi
          echo "Cypress folder verified."

      # 13. Install Cypress dependencies
      - name: Install Cypress dependencies
        working-directory: cypress
        run: |
          set -e
          npm install
          echo "Cypress dependencies installed successfully."

      # 14. Run Cypress tests with config path explicitly set
      - name: Run Cypress tests
        run: |
          set -e
          npx cypress run --config-file=cypress.config.ts
          echo "Cypress tests completed successfully."

      # 15. Tear down the Docker Compose environment
      - name: Tear down Docker Compose
        run: |
          set -e
          docker-compose down
          echo "Docker Compose environment torn down."
