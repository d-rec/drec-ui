name: Cypress CI Workflow

on:
  push:
    branches:
      - ft/register-new-account
  pull_request:
    branches:
      - ft/register-new-account

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      MODE: dev
      MNEMONIC: "shine ability artefact river cabin copy blind hello gift hospital tenant region"
      WEB3: https://volta-rpc.energyweb.org
      UI_BASE_URL: http://localhost:4200
      BACKEND_PORT: 3040
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: origin
      REACT_APP_BACKEND_URL: http://localhost:3040
      ADMIN_EMAIL: drec@energy.org
      ADMIN_PASSWORD: 1234Rc

    steps:
      # Step 1: Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v2

      # Step 2: Install pnpm and Rush globally
      - name: Install pnpm and Rush globally
        run: |
          npm install -g pnpm @microsoft/rush

      # Step 3: Install System Dependencies
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y influxdb-client docker-compose postgresql-client netcat curl

      # Step 4: Setup Node.js
      - name: Setup Node.js
        run: |
          curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.1/install.sh | bash
          export NVM_DIR="$HOME/.nvm"
          . "$NVM_DIR/nvm.sh"
          nvm install 20.14.0
          nvm use 20.14.0

      # Step 5: Clone Backend Repository
      - name: Clone Backend Repository
        run: |
          git clone --branch ft/register-new-account https://github.com/d-rec/drec-origin.git projects/drec-origin
          chmod -R 777 projects/drec-origin

      # Step 6: Start Docker Services
      - name: Start Docker Services
        working-directory: projects/drec-origin
        run: |
          docker-compose up -d || true
          docker-compose logs --tail=100

      # Step 7: Install Backend Dependencies and Build using Rush
      - name: Install Backend Dependencies using Rush
        working-directory: projects/drec-origin
        run: rush install  

      - name: Build Backend using Rush
        working-directory: projects/drec-origin
        run: rush build || true

      # Step 8: Start Backend using Rush
      - name: Start Backend using Rush
        working-directory: projects/drec-origin
        run: |
          rush start:dev || true # Keep the backend process running in the background

      # Step 9: Clear Database
      - name: Clear Database
        run: |
          echo "Clearing the database via API..."
          curl -X DELETE http://drec-origin-backend:3040/api/testing/clear-db  # Adjust for Docker service name

      # Step 10: Install and Start Frontend
      - name: Install and Start Frontend
        run: |
          pnpm install  # Use pnpm for dependency installation
          pnpm run start &  # Start frontend in the background

      # Step 11: Run Cypress Tests
      - name: Run Cypress Tests
        run: pnpx cypress run  # Run Cypress tests using pnpm

      # Step 12: Tear Down Docker Environment
      - name: Tear Down Docker Environment
        working-directory: projects/drec-origin
        run: docker-compose down
