name: CI Workflow

on:
  push:
    branches:
      - ft/register-new-account
  pull_request:
    branches:
      - ft/register-new-account

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the code
      - name: Checkout code
        uses: actions/checkout@v2

      # 2. Set up Node.js for frontend and backend
      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '20'

      # 3. Install Rush and pnpm globally
      - name: Install Rush and pnpm
        run: npm install -g @microsoft/rush pnpm

      # 4. Set up Docker for the backend
      - name: Set up Docker
        run: |
          sudo apt-get update
          sudo apt-get remove -y containerd  # Remove any conflicting package
          sudo apt-get install -y apt-transport-https ca-certificates curl software-properties-common
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y docker-ce docker-ce-cli containerd.io
          sudo systemctl enable docker
          sudo systemctl start docker
          docker --version  # Confirm Docker installation

      # 5. Install backend dependencies
      - name: Install backend dependencies
        working-directory: projects/drec-origin
        run: rush install

      # 6. Build the backend
      - name: Build backend
        working-directory: projects/drec-origin
        run: rush build

      # 7. Start the backend server
      - name: Start backend server
        working-directory: projects/drec-origin
        run: |
          nohup rush start:dev &  # Start the backend server in the background
          sleep 15  # Allow time for the server to initialize

      # 8. Verify backend server is running
      - name: Verify backend server is running
        run: |
          set -e
          timeout 60 bash -c "until curl -s http://localhost:3040; do echo 'Waiting for backend server to start...'; sleep 5; done"

      # 9. Clear the database
      - name: Clear database
        run: curl -X DELETE http://localhost:3040/api/testing/clear-db

      # 10. Install frontend dependencies
      - name: Install frontend dependencies
        working-directory: projects/drec-ui
        run: npm install

      # 11. Run frontend tests
      - name: Run frontend tests
        working-directory: projects/drec-ui
        run: npm test
