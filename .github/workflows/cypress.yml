name: CI Workflow

on:
  push:
    branches:
      - ft/register-new-account
  pull_request:
    branches:
      - ft/register-new-account

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the code
      - name: Checkout code
        uses: actions/checkout@v2

      # 2. Set up Node.js for frontend and backend
      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '20'

      # 3. Install Rush globally
      - name: Install Rush globally
        run: npm install -g @microsoft/rush pnpm

      # 4. Set up Docker for the backend
      - name: Set up Docker
        run: |
          sudo apt-get update
          sudo apt-get install -y docker.io
          sudo systemctl start docker
          sudo systemctl enable docker
          docker --version  # Confirm Docker is installed

      # 5. Install dependencies for the backend
      - name: Install backend dependencies
        working-directory: projects/drec-origin
        run: rush install

      # 6. Build the backend
      - name: Build backend
        working-directory: projects/drec-origin
        run: rush build

      # 7. Start the backend server
      - name: Start backend server
        working-directory: projects/drec-origin
        run: |
          nohup rush start:dev &  # Start backend in the background
          sleep 15  # Wait for it to initialize

      # 8. Verify backend is running
      - name: Verify backend server is running
        run: |
          until curl -s http://localhost:3040; do
            echo "Waiting for backend server to start..."
            sleep 5
          done

      # 9. Clear database
      - name: Clear database
        run: curl -X DELETE http://localhost:3040/api/testing/clear-db

      # 10. Install dependencies for the frontend
      - name: Install frontend dependencies
        working-directory: projects/drec-ui
        run: npm install

      # 11. Run frontend tests
      - name: Run frontend tests
        working-directory: projects/drec-ui
        run: npm test
