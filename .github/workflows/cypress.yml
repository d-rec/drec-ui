name: Run Cypress E2E Tests

on:
  push:
    branches:
      - ft/register-new-account  # Trigger on push to this branch
  pull_request:
    branches:
      - ft/register-new-account  # Trigger on pull requests to this branch

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out repository
      - name: Check out repository
        uses: actions/checkout@v2

      # Step 2: Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '18'

      # Step 3: Install Rush globally
      - name: Install Rush
        run: npm install -g @microsoft/rush

      # Step 4: Install dependencies using Rush
      - name: Install dependencies
        run: |
          rush update
          rush install

      # Step 5: Start the backend using Rush
      - name: Start backend
        run: |
          rush start:dev &
          
      # Step 6: Start the frontend
      - name: Start frontend
        run: |
          cd ./frontend  # Adjust path to your frontend directory
          npm install
          npm start &  # Start the frontend in the background

      # Step 7: Wait for services to start
      - name: Wait for services
        run: sleep 20  # Adjust the delay if necessary

      # Step 8: Install Cypress dependencies
      - name: Install Cypress dependencies
        run: |
          cd ./frontend  # Run Cypress commands in the frontend directory
          npm install cypress

      # Step 9: Run Cypress tests
      - name: Run Cypress tests
        run: npm run e2e
