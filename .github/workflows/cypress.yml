name: CI Workflow

on:
  push:
    branches:
      - ft/register-new-account
  pull_request:
    branches:
      - ft/register-new-account

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      # Environment variables
      MODE: dev
      WEB3: https://volta-rpc.energyweb.org
      UI_BASE_URL: http://localhost:4200
      DEBUG_API_KEY: debug
      BACKEND_PORT: 3040

      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: origin

      JWT_SECRET: thisisnotsecret
      JWT_EXPIRY_TIME: "7 days"
      MNEMONIC: "shine ability artefact river cabin copy blind hello gift hospital tenant region"
      ISSUER_PRIVATE_KEY: 4773097f508a6edd206150766ee25cb5abc1635f28f9cfd27e144872e89dc9c9
      DREC_BLOCKCHAIN_ADDRESS: "0xDeC1488838C65E355A9336eE8DdFc32665dB9222"
      CERTIFICATE_QUEUE_DELAY: 60000
      ADMIN_EMAIL: drec@energy.org
      ADMIN_PASSWORD: 1234Rc

    steps:
      # Step 1: Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v2

      # Step 2: Clone the backend repository
      - name: Clone Backend Repository
        run: |
          git clone --branch ft/register-new-account https://github.com/d-rec/drec-origin.git projects/drec-origin
          echo "Backend repository cloned successfully."

      # Step 3: Install Rush and pnpm globally
      - name: Install Rush and pnpm
        run: |
          npm install -g @microsoft/rush pnpm
          echo "Rush and pnpm installed successfully."

      # Step 4: Install Backend Dependencies using Rush
      - name: Install Backend Dependencies
        working-directory: projects/drec-origin
        run: |
          rush install
          echo "Rush dependencies installed."

      # Step 5: Install TypeScript tools in Backend Workspace
      - name: Install TypeScript Tools
        working-directory: projects/drec-origin/apps/drec-api
        run: |
          pnpm add ts-node tsconfig-paths typeorm --save-dev
          echo "TypeScript tools installed in backend workspace."

      # Step 6: Install Docker Compose
      - name: Install Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose
          echo "Docker Compose installed successfully."

      # Step 7: Build and Start Services using Docker Compose
      - name: Build and Start Docker Services
        working-directory: projects/drec-origin
        run: |
          docker-compose up --build -d
          echo "Docker services built and started."

      # Step 8: Start the Backend in Dev Mode
      - name: Start Backend in Dev Mode
        working-directory: projects/drec-origin
        run: |
          timeout 300s rush start:dev
          echo "Backend started in dev mode."

      # Step 9: Wait for Backend to be Ready
      - name: Wait for Backend to be Ready
        run: |
          sleep 30
          echo "Backend is now ready."

      # Step 10: Install and Start Frontend
      - name: Install and Start Frontend
        working-directory: projects/drec-origin
        run: |
          npm install
          npm run start &
          echo "Frontend started."

      # Step 11: Install Cypress Dependencies
      - name: Install Cypress Dependencies
        working-directory: cypress
        run: |
          npm install
          echo "Cypress dependencies installed successfully."

      # Step 12: Run Cypress Tests
      - name: Run Cypress Tests
        working-directory: cypress
        run: |
          npx cypress run --config-file=cypress.config.ts
          echo "Cypress tests completed."

      # Step 13: Tear Down Docker Compose Environment
      - name: Tear Down Docker Compose
        working-directory: projects/drec-origin
        run: |
          docker-compose down
          echo "Docker Compose environment torn down."
