name: Cypress E2E Workflow

on:
  push:
    branches:
      - develop
      - stage
      - prod
  pull_request:
    branches:
      - develop
      - stage
      - prod

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MODE: dev
      MNEMONIC: ${{ secrets.WALLET_MNEMONIC }}
      WEB3: https://volta-rpc.energyweb.org
      UI_BASE_URL: http://localhost:4200
      INFLUXDB_URL: http://localhost:8086
      INFLUXDB_TOKEN: admin:admin
      INFLUXDB_BUCKET: energy/autogen
      ISSUER_PRIVATE_KEY: ${{ secrets.ISSUER_PRIVATE_KEY }}
      DREC_BLOCKCHAIN_ADDRESS: "0xDeC1488838C65E355A9336eE8DdFc32665dB9222"
      CERTIFICATE_QUEUE_DELAY: 60000
      BACKEND_PORT: 3040
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: origin
      REACT_APP_BACKEND_URL: http://localhost:3040
      ADMIN_EMAIL: drec@energy.org
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Install pnpm and Rush globally
        run: |
          npm install -g pnpm @microsoft/rush

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y influxdb-client docker-compose postgresql-client netcat-openbsd curl

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/iron
          cache: npm

      - name: Clone Backend Repository
        run: |
          git clone https://github.com/d-rec/drec-origin.git projects/drec-origin
          chmod -R 777 projects/drec-origin

      - name: Start Docker Services
        working-directory: projects/drec-origin
        run: |
          docker-compose up -d || true
          docker-compose logs --tail=100

      - name: Install Backend Dependencies using Rush
        working-directory: projects/drec-origin
        run: rush install

      - name: Debug - Verify Utility Files
        working-directory: projects/drec-origin/apps/drec-api
        run: ls -R src/utils

      - name: Build Backend
        working-directory: projects/drec-origin
        run: rush build

      - name: Debug - Verify Build Output
        working-directory: projects/drec-origin/apps/drec-api
        run: ls -R dist

      - name: Start Backend and Wait for Readiness
        working-directory: projects/drec-origin
        run: |
          rush start:dev &
          echo "Waiting for backend to be ready..."
          until curl -s http://localhost:3040; do
            sleep 5
            echo "Backend is not ready yet..."
          done
          echo "Backend is ready!"

      - name: Install and Start Frontend
        run: |
          npm install
          nohup npm run start &
          echo "Waiting for frontend to be ready..."
          until curl -s http://localhost:4200; do
            sleep 5
            echo "Frontend is not ready yet..."
          done
          echo "Frontend is ready!"

      - name: Run Cypress Tests (Headless)
        run: pnpx cypress run

      - name: List Cypress Results
        run: |
          echo "=== Screenshots ==="
          ls -R cypress/screenshots || echo "No screenshots found."
          echo "=== Videos ==="
          ls -R cypress/videos || echo "No videos found."

      - name: Tear Down Docker Environment
        working-directory: projects/drec-origin
        run: docker-compose down
