name: CI Workflow

on:
  push:
    branches:
      - ft/register-new-account
  pull_request:
    branches:
      - ft/register-new-account

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the main repository
      - name: Checkout main repository
        uses: actions/checkout@v2

      # 2. Clone the backend repository
      - name: Clone backend repository
        run: |
          git clone --branch ft/register-new-account https://github.com/d-rec/drec-origin.git projects/drec-origin
          echo "Backend repository cloned successfully."

      # 3. Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '20'

      # 4. Install Rush and pnpm globally
      - name: Install Rush and pnpm
        run: |
          npm install -g @microsoft/rush pnpm

      # 5. Set up Docker Compose
      - name: Install Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      # 6. Set up PostgreSQL container using Docker Compose
      - name: Set up PostgreSQL container
        run: |
          printf "version: '3'\nservices:\n  postgres:\n    image: postgres:13\n    environment:\n      POSTGRES_USER: drec_user\n      POSTGRES_PASSWORD: password\n      POSTGRES_DB: drec_db\n    ports:\n      - '5432:5432'\n    networks:\n      - dbnet\nnetworks:\n  dbnet:\n    driver: bridge\n" > docker-compose.yml
          docker-compose up -d

      # 7. Wait for PostgreSQL container to be ready
      - name: Wait for PostgreSQL to be ready
        run: |
          echo "Waiting for PostgreSQL to be ready..."
          timeout 180 bash -c "until nc -z localhost 5432; do echo 'Waiting for PostgreSQL...'; sleep 5; done"
          echo "PostgreSQL is ready."

      # 8. Install backend dependencies
      - name: Install backend dependencies
        working-directory: projects/drec-origin
        run: |
          rush install

      # 9. Build the backend
      - name: Build backend
        working-directory: projects/drec-origin
        run: |
          rush build

      # 10. Set environment variables for DB
      - name: Configure environment variables
        working-directory: projects/drec-origin
        run: |
          cat <<EOF > .env
          DB_HOST=postgres
          DB_PORT=5432
          DB_USERNAME=drec_user
          DB_PASSWORD=password
          DB_DATABASE=drec_db
          EOF
          echo "Environment variables configured."

      # 11. Run Cypress tests (assuming frontend is running on localhost:4200)
      - name: Run Cypress tests
        run: |
          # Ensure the frontend is running before running tests
          echo "Waiting for frontend to start..."
          timeout 180 bash -c "until curl -s http://localhost:4200; do echo 'Waiting for frontend...'; sleep 5; done" || { echo "Frontend failed to start."; exit 1; }
          
          # Run Cypress tests
          npx cypress run

      # 12. Tear down the Docker Compose environment
      - name: Tear down Docker Compose
        run: |
          docker-compose down
