name: CI Workflow

on:
  push:
    branches:
      - ft/register-new-account
  pull_request:
    branches:
      - ft/register-new-account

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      # Environment variables for testing
      MODE: dev
      WEB3: https://volta-rpc.energyweb.org
      UI_BASE_URL: http://localhost:4200
      DEBUG_API_KEY: debug
      BACKEND_PORT: 3040

      # --- DATABASE --- #
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: origin

      # --- AUTH --- #
      JWT_SECRET: thisisnotsecret
      JWT_EXPIRY_TIME: "7 days"

      # --- BLOCKCHAIN --- #
      MNEMONIC: "shine ability artefact river cabin copy blind hello gift hospital tenant region"
      ISSUER_PRIVATE_KEY: 4773097f508a6edd206150766ee25cb5abc1635f28f9cfd27e144872e89dc9c9
      DREC_BLOCKCHAIN_ADDRESS: "0xDeC1488838C65E355A9336eE8DdFc32665dB9222"

      CERTIFICATE_QUEUE_DELAY: 60000

      # --- SMART METER READINGS --- #
      INFLUXDB_URL: http://localhost:8086
      INFLUXDB_TOKEN: admin:admin
      INFLUXDB_ORG: ""
      INFLUXDB_BUCKET: energy/autogen
      INFLUXDB_DB: energy
      INFLUXDB_ADMIN_USER: test
      INFLUXDB_ADMIN_PASSWORD: test
      INFLUXDB_USER: api
      INFLUXDB_USER_PASSWORD: secret

      # --- UI & External Services --- #
      REACT_APP_ISSUER_ADDRESS: "0x28130b5603cfcd597862a1F6786AbFEgrr645430Ddc2B92F"
      REACT_APP_SUPPORTED_NETWORK_IDS: 246
      REACT_APP_BLOCKCHAIN_EXPLORER_URL: https://volta-explorer.energyweb.org
      REACT_APP_GOOGLE_MAPS_API_KEY: "<API_KEY>"
      REACT_APP_REGISTRATION_MESSAGE_TO_SIGN: 'I register as D-REC Origin user'

      # Redis URL
      REDIS_URL: redis://localhost:6379

      # --- MAIL CONFIG --- #
      SMTP_HOST: 'smtp.gmail.com'
      SMTP_PORT: 587
      SMTP_LOGIN: '247-demo@energyweb.org'
      SMTP_PASSWORD: '****************'
      EMAIL_FROM_NAME: Energy Web Origin
      EMAIL_FROM: no-reply@example.com

      # S3 Bucket
      accessKeyId: "<accessKeyId>"
      secretAccessKey: "<secretAccessKey>"
      region: "<region>"
      bucketname: "<bucketname>"

      IREC_EVIDENT_API_URL: "https://api.sandbox.evident.dev"
      IREC_EVIDENT_REGISTRANT_EMAIL: "<IREC_EVIDENT_REGISTRANT_EMAIL>"
      IREC_EVIDENT_Password: "<IREC_EVIDENT_Password>"
      IREC_EVIDENT_API_Token: "<IREC_EVIDENT_API_Token>"
      ADMIN_EMAIL: drec@gmail.com
      ADMIN_PASSWORD: 1234Rc

    steps:
      # Step 1: Checkout Repository
      - name: Checkout Main Repository
        uses: actions/checkout@v2

      # Step 2: Install InfluxDB Client
      - name: Install InfluxDB Client
        run: |
          sudo apt-get update
          sudo apt-get install -y influxdb-client
          echo "InfluxDB Client installed."

      # Step 3: Install nvm and Node.js
      - name: Install Node Version Manager (nvm) and Node.js
        run: |
          curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.1/install.sh | bash
          source ~/.nvm/nvm.sh
          nvm install 20.14.0
          echo "nvm and Node.js installed."

      # Step 4: Install Rush and pnpm Globally
      - name: Install Rush and pnpm
        run: |
          npm install -g @microsoft/rush pnpm
          echo "Rush and pnpm installed successfully."

      # Step 5: Setup Database and Redis Services
      - name: Start PostgreSQL, Redis, and InfluxDB
        run: |
          docker-compose -f docker-compose.yml up --build -d
          echo "PostgreSQL, Redis, and InfluxDB services started."

      # Step 6: Create Postgres Database
      - name: Create Postgres Database
        run: |
          psql -h localhost -p 5432 -U postgres -c "CREATE DATABASE origin;"
          echo "Postgres database 'origin' created."

      # Step 7: Install Backend Dependencies
      - name: Install Backend Dependencies
        run: |
          rush install
          echo "Backend dependencies installed."

      # Step 8: Build Backend Project
      - name: Build Backend Project
        run: |
          rush build
          echo "Backend built successfully."

      # Step 9: Run Database Migrations
      - name: Run Database Migrations
        run: |
          rush start:dev
          echo "Database migrations executed."

      # Step 10: Install and Run Frontend
      - name: Install and Start Frontend
        working-directory: projects/drec-ui
        run: |
          npm install
          npm run start &
          echo "Frontend started successfully."

      # Step 11: Run Tests
      - name: Run Tests
        working-directory: projects/drec-origin
        run: |
          rush test
          echo "Tests executed successfully."

      # Step 12: Tear Down Docker Services
      - name: Tear Down Docker Services
        run: |
          docker-compose -f docker-compose.yml down
          echo "Docker services stopped."
