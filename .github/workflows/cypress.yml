name: CI Workflow

on:
  push:
    branches:
      - ft/register-new-account
  pull_request:
    branches:
      - ft/register-new-account

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the main repository
      - name: Checkout main repository
        uses: actions/checkout@v2

      # 2. Clone the backend repository
      - name: Clone backend repository
        run: |
          git clone --branch ft/register-new-account https://github.com/d-rec/drec-origin.git projects/drec-origin
          echo "Backend repository cloned successfully."

      # 3. Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '20'

      # 4. Install Rush and pnpm globally
      - name: Install Rush and pnpm
        run: |
          npm install -g @microsoft/rush pnpm
          echo "Rush and pnpm installed successfully."

      # 5. Set up Docker Compose
      - name: Set up Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose
          echo "Docker Compose installed successfully."

      # 6. Set up PostgreSQL container using Docker Compose
      - name: Set up PostgreSQL container
        run: |
          echo "version: '3'
          services:
            postgres:
              image: postgres:13
              environment:
                POSTGRES_USER: drec_user
                POSTGRES_PASSWORD: password
                POSTGRES_DB: drec_db
              ports:
                - '5432:5432'
              networks:
                - dbnet
          networks:
            dbnet:
              driver: bridge" > docker-compose.yml
          docker-compose up -d
          echo "PostgreSQL container started successfully."

      # 7. Wait for PostgreSQL container to be ready (no `pg_isready` errors)
      - name: Wait for PostgreSQL container to be ready
        run: |
          set -e
          echo "Waiting for PostgreSQL to be ready..."
          # We are waiting for PostgreSQL to be available by checking if port 5432 is accepting connections
          timeout 180 bash -c "until nc -z localhost 5432; do echo 'Waiting for PostgreSQL to be ready...'; sleep 5; done"
          echo "PostgreSQL is ready."

      # 8. Install backend dependencies
      - name: Install backend dependencies
        working-directory: projects/drec-origin
        run: |
          rush install
          echo "Backend dependencies installed successfully."

      # 9. Build the backend
      - name: Build backend
        working-directory: projects/drec-origin
        run: |
          rush build
          echo "Backend built successfully."

      # 10. Start backend server with environment variables
      - name: Start backend server
        working-directory: projects/drec-origin
        run: |
          # Ensure the .env file has the correct credentials for PostgreSQL
          echo "DB_HOST=postgres" >> .env
          echo "DB_PORT=5432" >> .env
          echo "DB_USERNAME=drec_user" >> .env
          echo "DB_PASSWORD=password" >> .env
          echo "DB_DATABASE=drec_db" >> .env
          nohup rush start:dev &  # Start the backend in the background
          sleep 60  # Allow time for the server to initialize
          echo "Backend server started successfully."

      # 11. Verify backend server is running
      - name: Verify backend server is running
        run: |
          set -e
          timeout 120 bash -c "until curl -s http://localhost:3040; do echo 'Waiting for backend server to start...'; sleep 5; done"
          echo "Backend server is running."

      # 12. Run database migrations
      - name: Run migrations
        working-directory: projects/drec-origin
        run: |
          # Run migrations (ensure the TypeORM config uses the .env values)
          npx ts-node -r tsconfig-paths/register node_modules/typeorm/cli.js migration:run --config node_modules/@energyweb/issuer-api/dist/js/ormconfig.js
          echo "Migrations completed successfully."

      # 13. Clear the database (optional)
      - name: Clear database
        run: |
          curl -X DELETE http://localhost:3040/api/testing/clear-db
          echo "Database cleared successfully."

      # 14. Install frontend dependencies
      - name: Install frontend dependencies
        working-directory: projects/drec-ui
        run: |
          npm install
          echo "Frontend dependencies installed successfully."

      # 15. Run frontend tests
      - name: Run frontend tests
        working-directory: projects/drec-ui
        run: |
          npm test
          echo "Frontend tests completed successfully."

      # 16. Tear down the Docker Compose environment
      - name: Tear down Docker Compose
        run: |
          docker-compose down
          echo "Docker Compose environment torn down."
