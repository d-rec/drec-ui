name: Code Quality

on:
  push:
    branches:
      - stage
      - prod
  pull_request:
    branches:
      - develop
      - stage
      - prod

jobs:
  lint-prettier:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/iron

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run Prettier
        run: npm run prettier

  lint-eslint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/iron

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run ESLint (error)
        run: npm run lint:error

      - name: Run ESLint (all)
        run: npm run lint

  check-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/iron

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build drec-ui
        run: npx ng build
