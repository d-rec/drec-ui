name: Deploy to Kubernetes

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
    secrets:
      aws-access-key-id:
        required: true
      aws-secret-access-key:
        required: true
      aws-region:
        required: true
      ecr-registry:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials for Kubernetes
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.aws-region }}

      - name: Set up kubectl
        run: |
          aws eks update-kubeconfig --region ${{ secrets.aws-region }} --name drec

      - name: Deploy to Kubernetes
        env:
          ECR_REGISTRY: ${{ secrets.ecr-registry }}
          ECR_REPOSITORY: drec-ui
          GITHUB_SHA: ${{ github.sha }}
        run: |
          kubectl -n ${{ inputs.environment }} set image deployment/drec-ui \
            drec-ui=$ECR_REGISTRY/$ECR_REPOSITORY:dev-${GITHUB_SHA}
            
            kubectl -n ${{ inputs.environment }} rollout status deployment/drec-api --timeout=300s
