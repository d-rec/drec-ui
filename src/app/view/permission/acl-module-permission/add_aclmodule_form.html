        <div class="col-md-4">
          <mat-form-field appearance="outline">
            <mat-label class="text-capitalize">Name</mat-label>
            <input matInput autofocus type="text" formControlName="name" />
          </mat-form-field>
        </div>
        <!-- <div class="col-md-3">
                    <mat-form-field appearance="outline">

                    </mat-form-field>


                </div> -->
        <div class="col-md-4">
          <mat-form-field appearance="outline">
            <mat-label class="text-capitalize">Description</mat-label>
            <input autofocus type="text" matInput formControlName="description" />
          </mat-form-field>
        </div>
        <div class="col-md-4">

          <mat-form-field appearance="outline">
            <mat-label class="text-capitalize">Permission</mat-label>

            <mat-select formControlName="permissions" multiple>
              <mat-option *ngFor="let permission of aclModulePermission"
                [value]="permission">{{permission}}</mat-option>
            </mat-select>
          </mat-form-field>

<div mat-dialog-actions class="d-flex justify-content-center pb-4">
  <button mat-button class="btn-primary text-capitalize" [mat-dialog-close]="true" (click)="onSubmit()">Submit</button>
  <button mat-button class="btn-default text-capitalize" [mat-dialog-close]="false">Cancel</button>
