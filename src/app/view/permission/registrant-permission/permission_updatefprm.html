<h1 mat-dialog-title>{{data.title}}</h1>
<div mat-dialog-content>{{data.message}}</div>

<mat-card>
  <form [formGroup]="permistion_updateForm">
    <mat-card-content>
      <div class="example-container1 row">
        <div class="col-md-6">
          <mat-form-field appearance="outline">
            <mat-label class="text-capitalize">Name</mat-label>
            <input
              matInput
              autofocus
              type="text"
              [(ngModel)]="registrantId"
              [ngModelOptions]="{standalone: true}"
              readonly
            />
          </mat-form-field>
        </div>

        <div class="col-md-4">
          <mat-form-field appearance="outline">
            <mat-label class="text-capitalize">Permission</mat-label>

            <mat-select formControlName="status">
              <mat-option
                *ngFor="let status of Permissionstatus"
                [value]="status"
                >{{status}}</mat-option
              >
            </mat-select>
          </mat-form-field>
        </div>
      </div>
    </mat-card-content>
  </form>
</mat-card>
<div mat-dialog-actions class="d-flex justify-content-center pb-4">
  <button mat-button class="btn-primary text-capitalize" [mat-dialog-close]="true" (click)="onSubmit()">Submit</button>
  <button mat-button class="btn-default text-capitalize" [mat-dialog-close]="false">Cancel</button>
</div>
