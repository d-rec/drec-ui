<div class="body-bg">
  <mat-card>
    <mat-card-title>Register Issuer</mat-card-title>
    <mat-card-content>
      <form [formGroup]="issuerForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="w-100 mb-3">
          <mat-label>Name</mat-label>
          <input
            matInput
            formControlName="name"
            placeholder="Enter issuer name"
            required
          />
          <mat-error
            *ngIf="
              issuerForm.get('name')?.invalid && issuerForm.get('name')?.touched
            "
          >
            Name is required
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-100 mb-3">
          <mat-label>Email</mat-label>
          <input
            matInput
            formControlName="email"
            placeholder="Enter email"
            required
          />
          <mat-error
            *ngIf="
              issuerForm.get('email')?.invalid &&
              issuerForm.get('email')?.touched
            "
          >
            Valid email is required
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-100 mb-3">
          <mat-label>Organization</mat-label>
          <input
            matInput
            formControlName="organization"
            placeholder="Enter organization"
            required
          />
          <mat-error
            *ngIf="
              issuerForm.get('organization')?.invalid &&
              issuerForm.get('organization')?.touched
            "
          >
            Organization is required
          </mat-error>
        </mat-form-field>

        <button
          mat-raised-button
          color="primary"
          type="submit"
          [disabled]="issuerForm.invalid"
        >
          Register Issuer
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
