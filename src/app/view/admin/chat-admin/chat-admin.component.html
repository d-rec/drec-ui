<div class="chat-admin">
  <mat-tab-group
    class="chat-admin__tabs"
    [selectedIndex]="selectedIndex"
    (selectedIndexChange)="onTabChange($event)"
    animationDuration="0ms">
    <mat-tab label="Conversations">
      <ng-template matTabContent>
        <app-chat-review></app-chat-review>
      </ng-template>
    </mat-tab>
    <mat-tab label="Webhooks" *ngIf="isAdmin">
      <ng-template matTabContent>
        <app-webhooks></app-webhooks>
      </ng-template>
    </mat-tab>
  </mat-tab-group>
</div>
