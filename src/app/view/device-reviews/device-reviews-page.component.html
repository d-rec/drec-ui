<ng-container *ngIf="canReview; else chatListView">
  <div class="ds-page">
    <div class="ds-tabs">
      <button class="ds-tab" [class.ds-tab--active]="activeTab === 'reviews'" (click)="activeTab = 'reviews'">Device Reviews</button>
      <button class="ds-tab" [class.ds-tab--active]="activeTab === 'map'" (click)="activeTab = 'map'">World Map</button>
    </div>
    <div class="ds-content">
      <app-ds-documents-window *ngIf="activeTab === 'reviews'"></app-ds-documents-window>
      <app-ds-map-window       *ngIf="activeTab === 'map'" (onPinClick)="onMapPinClick($event)"></app-ds-map-window>
    </div>
  </div>
  <app-ds-satellite-window   *ngIf="showSatellite" [zIndex]="zFor('satellite')"  (bringToFront)="bringToFront('satellite')" (close)="showSatellite=false"></app-ds-satellite-window>
  <app-ds-device-info-window [zIndex]="zFor('deviceInfo')" (bringToFront)="bringToFront('deviceInfo')"></app-ds-device-info-window>
  <app-ds-picture-window
    *ngFor="let p of (openPictures$ | async) || []; let idx = index; trackBy: trackPictureId"
    [pic]="p"
    [initX]="200 + idx * 40"
    [initY]="100 + idx * 40"
    [zIndex]="p.zOrder"
    (bringToFront)="bringPictureToFront(p.id)"
  ></app-ds-picture-window>
  <app-ds-pdf-window         [zIndex]="zFor('pdf')"        (bringToFront)="bringToFront('pdf')"></app-ds-pdf-window>
  <app-oc-checklist-panel    [storageKey]="checklistStorageKey$ | async"></app-oc-checklist-panel>
</ng-container>
<ng-template #chatListView>
  <div class="ds-page">
    <div class="ds-content">
      <app-ds-chat-list></app-ds-chat-list>
    </div>
  </div>
</ng-template>
