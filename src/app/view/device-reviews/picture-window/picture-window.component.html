<app-ds-floating-window
  title="Picture"
  [initX]="initX" [initY]="initY"
  [initWidth]="600" [initHeight]="480"
  [zIndex]="zIndex"
  (bringToFront)="bringToFront.emit()"
  (close)="close()"
>
    <div class="picw">
      <!-- Panel detection is reserved for the live satellite view; regular
           uploaded pictures show the image only (zoom/pan). -->
      <div class="picw__image-area">
        <div class="picw__image-wrap" appImageZoomPan [resetKey]="url" title="Scroll to zoom, drag to pan, double-click to reset">
          <img #imgEl class="picw__img" [src]="url" alt="Device picture" crossorigin="anonymous" />
        </div>
      </div>
      <div *ngIf="ocrRunning" class="picw__progress">
        <div class="picw__progress-bar" [style.width.%]="ocrProgress"></div>
      </div>
      <div *ngIf="ocrText" class="picw__ocr-result">
        <div class="picw__ocr-header">
          <strong>Extracted Text</strong>
          <input class="picw__search" type="text" placeholder="Search..." [(ngModel)]="ocrSearch" />
          <button class="picw__copy-btn" (click)="copyOcrText()">Copy</button>
        </div>
        <pre class="picw__ocr-text" [innerHTML]="highlightOcr(ocrText!, ocrSearch)"></pre>
      </div>
      <!-- Detect confirm dialog -->
      <div class="picw__confirm-backdrop" *ngIf="showDetectConfirm" (click)="cancelDetect()">
        <div class="picw__confirm" (click)="$event.stopPropagation()">
          <p class="picw__confirm-msg">{{ detectConfirmMsg }}</p>
          <div class="picw__confirm-actions">
            <button type="button" class="picw__confirm-btn picw__confirm-btn--cancel" (click)="cancelDetect()">Cancel</button>
            <button type="button" class="picw__confirm-btn picw__confirm-btn--ok" (click)="confirmDetect()">OK</button>
          </div>
        </div>
      </div>
  </div>
</app-ds-floating-window>
