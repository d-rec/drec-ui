<ng-container *ngIf="(svc.viewDeviceInfoId$ | async) !== null">
  <app-ds-floating-window
    title="Device Details"
    [initX]="80"
    [initY]="60"
    [initWidth]="560"
    [initHeight]="640"
    [zIndex]="zIndex"
    (bringToFront)="bringToFront.emit()"
    (close)="close()"
  >
    <div class="di">
      <div class="di__search">
        <input
          type="search"
          class="di__search-input"
          placeholder="Search fields..."
          [(ngModel)]="search"
          (keydown.escape)="search = ''"
        />
        <button
          *ngIf="search"
          type="button"
          class="di__search-clear"
          (click)="search = ''"
          title="Clear"
        >
          &times;
        </button>
      </div>

      <div class="di__body">
        <div *ngIf="loading" class="di__loading">Loading…</div>

        <ng-container *ngIf="deviceInfo && !loading">
          <ng-container
            *ngFor="let section of filteredSections; trackBy: trackSection"
          >
            <h3 *ngIf="section.heading" class="di__heading">
              {{ section.heading }}
              <span
                *ngIf="section.heading === 'Documents'"
                style="font-weight: 400; color: #64748b; font-size: 12px"
              >
                ({{ documents.length }} file{{
                  documents.length === 1 ? '' : 's'
                }}
                loaded)
              </span>
            </h3>
            <ng-container *ngFor="let f of section.fields; trackBy: trackField">
              <ng-container
                *ngIf="f.tabular && f.links && f.links.length; else nonTabular"
              >
                <div
                  class="di__field"
                  [attr.title]="f.hint || null"
                  [class.di__field--hinted]="f.hint"
                >
                  <b [innerHTML]="f.label | highlight: search"></b>
                  <span class="di__me-count">
                    ({{ f.links.length }} file{{
                      f.links.length === 1 ? '' : 's'
                    }})</span
                  >
                </div>
                <div class="di__me-table">
                  <div class="di__me-row di__me-row--header">
                    <span class="di__me-idx">#</span>
                    <span class="di__me-name">Filename</span>
                    <span class="di__me-type">Type</span>
                  </div>
                  <div
                    class="di__me-row"
                    *ngFor="let l of f.links; let i = index; trackBy: trackLink"
                  >
                    <span class="di__me-idx">{{ i + 1 }}</span>
                    <a
                      class="di__me-name"
                      href="javascript:void(0)"
                      (click)="openLink(l.url, $event, l.docType)"
                      (mousedown)="openLink(l.url, $event, l.docType)"
                      [innerHTML]="l.text | highlight: search"
                    ></a>
                    <span class="di__me-type">{{ linkExt(l) || '—' }}</span>
                  </div>
                </div>
              </ng-container>
              <ng-template #nonTabular>
                <p
                  class="di__field"
                  [attr.title]="f.hint || null"
                  [class.di__field--hinted]="f.hint"
                >
                  <b [innerHTML]="f.label | highlight: search"></b>:
                  <ng-container
                    *ngIf="f.links && f.links.length; else maybeItems"
                  >
                    <ng-container *ngFor="let l of f.links; let last = last">
                      <a
                        href="javascript:void(0)"
                        (click)="openLink(l.url, $event)"
                        (mousedown)="openLink(l.url, $event)"
                        [innerHTML]="l.text | highlight: search"
                      ></a
                      ><span *ngIf="!last">, </span>
                    </ng-container>
                  </ng-container>
                  <ng-template #maybeItems>
                    <span
                      *ngIf="!f.items || f.items.length === 0"
                      [innerHTML]="f.value || '—' | highlight: search"
                    ></span>
                  </ng-template>
                </p>
                <p
                  *ngFor="let it of f.items; let i = index"
                  class="di__field di__field--sub"
                >
                  <span class="di__sub-bullet">↳</span>
                  <span
                    [innerHTML]="i + 1 + '. ' + it | highlight: search"
                  ></span>
                </p>
              </ng-template>
            </ng-container>

            <div
              *ngIf="section.showSatPreview && satPreview && !search"
              class="di__sat"
            >
              <div
                class="di__sat-wrap"
                [style.left.px]="satPreview.offsetX"
                [style.top.px]="satPreview.offsetY"
              >
                <img
                  *ngFor="let t of satPreview.tiles"
                  [src]="t.url"
                  width="256"
                  height="256"
                  [style.position]="'absolute'"
                  [style.left.px]="t.left"
                  [style.top.px]="t.top"
                  alt=""
                />
              </div>
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="30"
                viewBox="0 0 24 36"
                class="di__sat-pin"
              >
                <path
                  d="M12 0C5.373 0 0 5.373 0 12c0 8.25 12 24 12 24S24 20.25 24 12C24 5.373 18.627 0 12 0z"
                  fill="#e53e3e"
                  stroke="#fff"
                  stroke-width="1.5"
                />
                <circle cx="12" cy="12" r="5" fill="#fff" fill-opacity="0.85" />
              </svg>
            </div>
          </ng-container>
        </ng-container>

        <!-- Evidence-provenance report (registrant-generated HTML),
             rendered inline so the reviewer can see at a glance
             which fields are document-backed and click straight into
             the source documents. -->
        <section *ngIf="provenanceHtml || provenanceLoading" class="di__provenance" style="border:1px solid #e2e8f0;border-radius:8px;padding:12px;margin-top:12px;background:#f8fafc">
          <div *ngIf="provenanceLoading" style="font-size:12px;color:#64748b">Loading evidence-provenance report…</div>
          <div *ngIf="provenanceHtml" [innerHTML]="provenanceHtml"></div>
        </section>
      </div>

      <div class="di__footer">
        <button type="button" class="di__btn" (click)="copyVisible()">
          Copy
        </button>
        <button
          type="button"
          class="di__btn di__btn--primary"
          (click)="close()"
        >
          Close
        </button>
      </div>
    </div>
  </app-ds-floating-window>
</ng-container>
