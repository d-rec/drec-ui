<ng-container *ngIf="safeUrl">
  <app-ds-floating-window
    title="Document Viewer"
    [initX]="150" [initY]="80"
    [initWidth]="1100" [initHeight]="650"
    [zIndex]="zIndex"
    (bringToFront)="bringToFront.emit()"
    (close)="close()"
  >
    <app-pdf-preview
      [previewUrl]="safeUrl"
      previewType="pdf"
      [ocrSource]="currentUrl">
    </app-pdf-preview>
  </app-ds-floating-window>
</ng-container>
