<div class="body-bg pt-4">
  <mat-card class="mb-3">
    <mat-card-content class="pt-4">
  <div [formGroup]="updateForm">
    <div class="row">
      <div class="col-md-3">
        <mat-form-field appearance="outline">
          <mat-label class="text-capitalize">First Name</mat-label>
          <input
            readonly
            type="text"
            matInput
            formControlName="firstName"
            [(ngModel)]="firstName"
            test-id="first-name"
          />
        </mat-form-field>
      </div>
      <div class="col-md-3">
        <mat-form-field appearance="outline">
          <mat-label class="text-capitalize">Last Name</mat-label>
          <input
            readonly
            type="text"
            matInput
            formControlName="lastName"
            [(ngModel)]="lastName"
            test-id="last-name"
          />
        </mat-form-field>
      </div>
      <div class="col-md-3">
        <mat-form-field appearance="outline">
          <mat-label class="text-capitalize">Email</mat-label>
          <input
            readonly
            type="email"
            matInput
            formControlName="email"
            [(ngModel)]="email"
            test-id="email"
          />
        </mat-form-field>
      </div>
    </div>
  </div>

  <hr />

  <div class="row mb-3">
    <div class="col-md-3">
      <mat-form-field appearance="outline">
        <mat-label>Organization Name</mat-label>
        <input matInput readonly [value]="orgName" />
      </mat-form-field>
    </div>
    <div class="col-md-3">
      <mat-form-field appearance="outline">
        <mat-label>Type</mat-label>
        <input matInput readonly [value]="orgType" />
      </mat-form-field>
    </div>
    <div class="col-md-3">
      <mat-form-field appearance="outline">
        <mat-label>Status</mat-label>
        <input matInput readonly [value]="orgStatus" />
      </mat-form-field>
    </div>
  </div>

  <hr />

  <div class="d-flex justify-content-between align-items-center">
    <h3 class="fw-bold mb-0">Security Setting</h3>
    <button
      type="button"
      class="btn btn-primary text-capitalize px-4"
      (click)="openPasswordDialog()"
      test-id="open-password-dialog"
    >
      Change Password
    </button>
  </div>
    </mat-card-content>
  </mat-card>

  <mat-card class="mb-3" *ngIf="loginuser?.role !== 'Admin'">
    <mat-card-content>
      <p>Permanently delete your account and all associated data. This action cannot be undone.</p>
      <button
        type="button"
        class="btn btn-danger text-capitalize px-4"
        (click)="onDeleteAccount()"
      >
        Delete My Account
      </button>
    </mat-card-content>
  </mat-card>
</div>
