<h2 mat-dialog-title>Change Password</h2>
<form [formGroup]="resetpasswordform" (ngSubmit)="submit()">
  <mat-dialog-content>
    <div class="mb-2">
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Current Password</mat-label>
        <input
          autocomplete="current-password"
          matInput
          [type]="hideOld ? 'password' : 'text'"
          formControlName="oldPassword"
          test-id="old-password"
        />
        <button
          mat-icon-button
          matSuffix
          type="button"
          (click)="hideOld = !hideOld"
          [attr.aria-label]="'Hide password'"
          [attr.aria-pressed]="hideOld"
        >
          <mat-icon>{{ hideOld ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
        <mat-error *ngIf="checkValidation('oldPassword')">
          {{ getErrorPassword('oldPassword') }}
        </mat-error>
      </mat-form-field>
    </div>
    <div class="mt-3 mb-2">
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>New Password</mat-label>
        <input
          autocomplete="new-password"
          matInput
          [type]="hide ? 'password' : 'text'"
          formControlName="newPassword"
          test-id="new-password"
        />
        <button
          mat-icon-button
          matSuffix
          type="button"
          (click)="hide = !hide"
          [attr.aria-label]="'Hide password'"
          [attr.aria-pressed]="hide"
        >
          <mat-icon>{{ hide ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
        <mat-hint>Minimum 6 characters with letters and at least one number</mat-hint>
        <mat-error *ngIf="checkValidation('newPassword')">
          {{ getErrorPassword('newPassword') }}
        </mat-error>
      </mat-form-field>
    </div>
    <div class="mt-4">
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Confirm Password</mat-label>
        <input
          autocomplete="new-password"
          matInput
          [type]="hide1 ? 'password' : 'text'"
          formControlName="confirmPassword"
          test-id="confirm-password"
        />
        <button
          mat-icon-button
          matSuffix
          type="button"
          (click)="hide1 = !hide1"
          [attr.aria-label]="'Hide password'"
          [attr.aria-pressed]="hide1"
        >
          <mat-icon>{{ hide1 ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
        <mat-error *ngIf="checkValidation('confirmPassword')">
          {{ getErrorPassword('confirmPassword') }}
        </mat-error>
      </mat-form-field>
    </div>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button
      type="button"
      class="btn btn-outline-secondary me-2"
      (click)="cancel()"
      [disabled]="submitting"
    >
      Cancel
    </button>
    <button
      type="submit"
      class="btn btn-primary"
      [disabled]="resetpasswordform.invalid || submitting"
      test-id="reset-password-form"
    >
      <span *ngIf="!submitting">Update Password</span>
      <span *ngIf="submitting">Updating…</span>
    </button>
  </mat-dialog-actions>
</form>
