<div class="body-bg">
  <mat-card>
    <mat-card-header>
      <mat-card-title>
        <h2 class="pb-0 mb-0 fw-bold text-capitalize">Dashboard</h2>
      </mat-card-title>
    </mat-card-header>
    <hr />
    <mat-card-content>

      <!-- Regular user: single organization -->
      <ng-container *ngIf="!isApiUser">
        <div class="content">
          <div class="column col-4">
            <div class="row">
              <p><b>Organization Name</b>:&nbsp;{{ organization.name }}</p>
            </div>
          </div>
          <div class="column col-4">
            <div class="row">
              <p><b>Organization Type</b>:&nbsp;{{ organization.organizationType }}</p>
            </div>
          </div>
          <div class="column col-4">
            <div class="row">
              <p><b>Status</b>:&nbsp;{{ organization.status }}</p>
            </div>
          </div>
        </div>
      </ng-container>

      <!-- ApiUser: list of managed organizations -->
      <ng-container *ngIf="isApiUser">
        <table mat-table [dataSource]="apiUserOrganizations" class="w-100">
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Organization Name</th>
            <td mat-cell *matCellDef="let org">{{ org.name }}</td>
          </ng-container>
          <ng-container matColumnDef="organizationType">
            <th mat-header-cell *matHeaderCellDef>Type</th>
            <td mat-cell *matCellDef="let org">{{ org.organizationType }}</td>
          </ng-container>
          <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef>Status</th>
            <td mat-cell *matCellDef="let org">{{ org.status }}</td>
          </ng-container>
          <tr mat-header-row *matHeaderRowDef="['name', 'organizationType', 'status']"></tr>
          <tr mat-row *matRowDef="let row; columns: ['name', 'organizationType', 'status']"></tr>
        </table>
        <p *ngIf="apiUserOrgsError" class="text-danger mt-2">{{ apiUserOrgsError }}</p>
        <p *ngIf="!apiUserOrgsError && apiUserOrganizations.length === 0" class="text-muted mt-2">
          No organizations found.
        </p>
      </ng-container>

      <div class="d-flex align-items-center gap-2 mt-3" *ngIf="isApiUser">
        <span>UI</span>
        <mat-slide-toggle
          [(ngModel)]="isApiMode"
          color="primary"
        ></mat-slide-toggle>
        <span>API</span>
      </div>

    </mat-card-content>
  </mat-card>
</div>
