<div class="body-bg p-5">
  <mat-card *ngIf="!showBulkUploadLogs">
    <mat-card-header
      class="d-flex justify-content-between mat-crd-hide align-items-center"
    >
      <div>
        <h2 class="pb-0 mb-0 fw-bold text-capitalize">
          MeterRead Bulk Registration
        </h2>
      </div>
      <div class="d-flex gap-3">
        <button
          mat-raised-button
          class="btn btn-primary"
          (click)="downloadFile()"
        >
          <mat-icon>download</mat-icon>
          Download Template
        </button>
        <button
          class="btn btn-dark justify-content-end px-4"
          (click)="displayBulkUploads()"
        >
          <mat-icon class="align-middle">refresh</mat-icon>
        </button>
      </div>
    </mat-card-header>
    <hr />
    <mat-card-content>
      <form>
        <div class="row">
          <div
            class="col-md-3"
            *ngIf="
              loggedInUser.role === 'Admin' || loggedInUser.role === 'Registrant'
            "
          >
            <mat-form-field appearance="outline">
              <mat-label class="text-capitalize">Organization</mat-label>
              <input
                matInput
                [(ngModel)]="organizationName"
                [ngModelOptions]="{ standalone: true }"
                [matAutocomplete]="orgAuto"
                (input)="filterOrganization()"
              />
              <mat-autocomplete
                #orgAuto="matAutocomplete"
                (optionSelected)="selectOrganization($event)"
              >
                <mat-option
                  *ngFor="let code of filteredOrganizations"
                  [value]="code.name"
                >
                  {{ code.name }}
                </mat-option>
              </mat-autocomplete>
            </mat-form-field>
          </div>
          <div class="col-md-3">
            <mat-form-field appearance="outline">
              <div>
                <mat-toolbar class="bg-transparent h-auto p-0">
                  <input
                    matInput
                    [value]="fileName"
                    (click)="openFileExplorer()"
                    test-id="select-file"
                    

                  />
                </mat-toolbar>
                <div class="d-flex justify-content-center">
                  <input
                    type="file"
                    hidden
                    id="fileInput"
                    (change)="selectFile($event)"
                    name="fileInput"
                    accept=".csv"
                    test-id="choose-read-bulk-file"
                  />
                </div>
              </div>
            </mat-form-field>
          </div>
          <div class="col-md-6 d-flex gap-2 mt-4 mb-4">
            <button
              class="btn btn-primary"
              [disabled]="!currentFile"
              (click)="upload()"
              test-id="upload-read-bulk-file"
            >
              Upload
            </button>
            <button
              class="btn btn-dark"
              [disabled]="!currentFile"
              (click)="reset()"
            >
              Clear
            </button>
          </div>
        </div>
      </form>
      <div class="mat-elevation-z8 text-center">
        <table
          mat-table
          [dataSource]="dataSource"
          class="mat-elevation-z8"
          matSort
        >
          <!-- Position Column -->
          <ng-container matColumnDef="serialNo">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
            <td mat-cell *matCellDef="let row; let i = index">{{ i + 1 }}</td>
          </ng-container>
          <ng-container matColumnDef="createdAt">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>
              Created At
            </th>
            <td mat-cell *matCellDef="let element">
              {{ element.createdAt | date: 'dd MMM y hh:mm' }}
            </td>
          </ng-container>

          <!-- Name Column -->
          <ng-container matColumnDef="jobId">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>JobId</th>
            <td mat-cell *matCellDef="let element">{{ element.jobId }}</td>
          </ng-container>

          <!-- Weight Column -->
          <ng-container matColumnDef="fileId">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>File Id</th>
            <td mat-cell *matCellDef="let element">{{ element.fileId }}</td>
          </ng-container>

          <!-- Status Column -->
          <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
            <td mat-cell *matCellDef="let element">{{ element.status }}</td>
          </ng-container>
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Action</th>
            <td mat-cell *matCellDef="let row; let i = index">
              <button
                class="btn-primary d-flex align-items-center btn-pad btn btn-sm action-icons"
                (click)="getBulkUploadLogs(row.id, row.organizationId)"
              >
                <mat-icon class="mt-2">visibility</mat-icon> Logs
              </button>
            </td>
          </ng-container>
          <tr mat-header-row *matHeaderRowDef="bulkUploadColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: bulkUploadColumns"></tr>
        </table>
        <mat-paginator
          [pageSize]="pageSize"
          aria-label="Select page of users"
        ></mat-paginator>
      </div>
    </mat-card-content>
  </mat-card>
  <mat-card *ngIf="showBulkUploadLogs">
    <mat-card-header class="d-flex justify-content-between align-items-center">
      <mat-card-title class="d-flex justify-content-between">
        <div>
          <h2 class="pb-0 mb-0 fw-bold text-capitalize">
            Reads Bulk Status Log
          </h2>
        </div>
      </mat-card-title>

      <div class="d-flex justify-content-end">
        <button
          class="btn-content-back btn d-flex justify-content-end align-items-center btn-sm"
          (click)="displayBulkUploads()"
        >
          <mat-icon class="fs-5 me-2 mt-1">arrow_back</mat-icon> Go Back
        </button>
      </div>
    </mat-card-header>
    <hr />
    <mat-card-content>
      <div class="content mat-elevation-z8 text-center">
        <table mat-table [dataSource]="dataSource1" class="mat-elevation-z8">
          <ng-container matColumnDef="error">
            <th mat-header-cell *matHeaderCellDef>Error</th>
            <td mat-cell *matCellDef="let element">
              {{ element }}
            </td>
          </ng-container>
          <tr mat-header-row *matHeaderRowDef="bulkUploadLogsColumn"></tr>
          <tr mat-row *matRowDef="let row; columns: bulkUploadLogsColumn"></tr>
        </table>
        <mat-paginator
          [pageSize]="pageSize"
          aria-label="Select page of users"
        ></mat-paginator>
      </div>
    </mat-card-content>
  </mat-card>
</div>
