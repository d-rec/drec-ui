<div class="map-container">
  <div
    class="map"
    leaflet
    [leafletOptions]="options"
    (leafletMapReady)="onMapReady($event)"
  ></div>
  <ng-container *ngIf="satellite">
    <canvas
      #overlayCanvas
      class="detect-overlay"
      [class.visible]="showOverlay"
      [class.draw-active]="drawMode"
      [class.select-active]="predictions.length > 0 && !drawMode"
      (click)="onRegionClick($event)"
      (mousedown)="onCanvasMouseDown($event)"
      (mousemove)="onCanvasMouseMove($event); onRegionHover($event)"
      (mouseup)="onCanvasMouseUp($event)"
    ></canvas>
    <div class="detect-toolbar" (click)="$event.stopPropagation()" (mousedown)="$event.stopPropagation()" (mouseup)="$event.stopPropagation()">
      <button
        type="button"
        class="detect-btn"
        (click)="detectPanels()"
        [disabled]="detecting"
      >
        {{ detecting ? 'Scanning...' : showOverlay ? 'Re-scan' : '⚡ Detect Panels' }}
      </button>
      <button
        type="button"
        class="detect-btn"
        [class.detect-btn--active]="drawMode"
        (click)="toggleDrawMode()"
        title="Draw rectangle"
      >
        &#9645; Draw
      </button>
      <button
        type="button"
        class="detect-btn detect-btn--camera"
        (click)="captureScreenshot()"
        title="Save screenshot"
        [disabled]="detecting"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      </button>
      <button
        type="button"
        class="detect-btn detect-btn--clear"
        *ngIf="showOverlay"
        (click)="clearOverlay()"
      >
        Clear
      </button>
      <span class="detect-count" *ngIf="panelCount > 0"
        >{{ panelCount }} region{{ panelCount === 1 ? '' : 's' }} found</span
      >
      <span class="detect-error" *ngIf="detectError">{{ detectError }}</span>
    </div>
    <div class="detect-confirm-backdrop" *ngIf="showDetectConfirm" (click)="cancelDetect()">
      <div class="detect-confirm" (click)="$event.stopPropagation()">
        <p class="detect-confirm__msg">Panel detection uses a free-tier license with a limited number of scans. Proceed anyway?</p>
        <div class="detect-confirm__actions">
          <button type="button" class="detect-confirm__btn detect-confirm__btn--cancel" (click)="cancelDetect()">Cancel</button>
          <button type="button" class="detect-confirm__btn detect-confirm__btn--ok" (click)="confirmDetect()">OK</button>
        </div>
      </div>
    </div>
  </ng-container>
</div>
