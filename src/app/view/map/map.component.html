<div class="map-container">
  <div
    class="map"
    leaflet
    [leafletOptions]="options"
    (leafletMapReady)="onMapReady($event)"
  ></div>
  <ng-container *ngIf="satellite">
    <!--
      HTML pin rendered above the detection canvas. Leaflet's marker
      pane lives inside .leaflet-container which has its own stacking
      context (translate3d on each pane), so the leaflet centre marker
      can never get above our sibling .detect-overlay regardless of
      pane z-indexes. This DOM-level pin sidesteps that.
    -->
    <div *ngIf="centerPin && pinVisible" class="center-pin" aria-hidden="true"
         [style.left.px]="pinX" [style.top.px]="pinY">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="36" viewBox="0 0 24 36">
        <path d="M12 0C5.373 0 0 5.373 0 12c0 8.25 12 24 12 24S24 20.25 24 12C24 5.373 18.627 0 12 0z"
              fill="#e53e3e" stroke="#fff" stroke-width="1.5"/>
        <circle cx="12" cy="12" r="5" fill="#fff" fill-opacity="0.85"/>
      </svg>
    </div>
    <canvas
      #overlayCanvas
      class="detect-overlay"
      [class.visible]="showOverlay"
      [class.draw-active]="drawMode"
      [class.select-active]="predictions.length > 0 && !drawMode"
      (click)="onRegionClick($event)"
      (mousedown)="onCanvasMouseDown($event)"
      (mousemove)="onCanvasMouseMove($event); onRegionHover($event)"
      (mouseup)="onCanvasMouseUp($event)"
    ></canvas>
    <div class="detect-toolbar" (click)="$event.stopPropagation()" (mousedown)="$event.stopPropagation()" (mouseup)="$event.stopPropagation()">
      <button
        type="button"
        class="detect-btn"
        (click)="detectPanels()"
        [disabled]="detecting || tilesLoading"
        [title]="tilesLoading ? 'Waiting for satellite tiles to finish loading' : 'Run AI panel detection (Roboflow) on the current satellite view. Found regions appear as overlays you can click to delete.'"
      >
        {{ detecting ? 'Scanning...' : tilesLoading ? 'Loading tiles…' : showOverlay ? 'Re-scan' : '⚡ Detect Panels' }}
      </button>
      <button
        type="button"
        class="detect-btn"
        [class.detect-btn--active]="drawMode"
        (click)="toggleDrawMode()"
        title="Toggle draw mode: drag a rectangle on the map to add a region the AI missed."
      >
        &#9645; Draw
      </button>
      <button
        type="button"
        class="detect-btn detect-btn--camera"
        (click)="captureScreenshot()"
        title="Save a screenshot of the current map view (with any panel overlays) as a PROJECT_PHOTOS upload."
        [disabled]="detecting"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      </button>
      <button
        type="button"
        class="detect-btn detect-btn--clear"
        *ngIf="showOverlay"
        (click)="clearOverlay()"
      >
        Clear
      </button>
      <span class="detect-count" *ngIf="panelCount > 0"
        >{{ panelCount }} region{{ panelCount === 1 ? '' : 's' }} found</span
      >
    </div>
    <div class="detect-error-toast" *ngIf="detectError" role="alert">
      <div class="detect-error-toast__head">
        <strong>Detection error</strong>
        <span class="detect-error-toast__spacer"></span>
        <button type="button" class="detect-error-toast__btn"
                (click)="copyDetectError()"
                [class.detect-error-toast__btn--ok]="errorCopied"
                title="Copy the full error to the clipboard">
          {{ errorCopied ? '✓ Copied' : '📋 Copy' }}
        </button>
        <button type="button" class="detect-error-toast__btn"
                (click)="dismissDetectError()"
                title="Dismiss">
          ✕
        </button>
      </div>
      <pre class="detect-error-toast__body">{{ detectError }}</pre>
    </div>
    <div class="detect-confirm-backdrop" *ngIf="showDetectConfirm" (click)="cancelDetect()">
      <div class="detect-confirm" (click)="$event.stopPropagation()">
        <p class="detect-confirm__msg">Panel detection uses a free-tier license with a limited number of scans. Proceed anyway?</p>
        <div class="detect-confirm__actions">
          <button type="button" class="detect-confirm__btn detect-confirm__btn--cancel" (click)="cancelDetect()">Cancel</button>
          <button type="button" class="detect-confirm__btn detect-confirm__btn--ok" (click)="confirmDetect()">OK</button>
        </div>
      </div>
    </div>
  </ng-container>
</div>
