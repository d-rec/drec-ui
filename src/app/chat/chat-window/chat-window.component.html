<div class="chat-window" [class.minimized]="minimized"
     [style.width.px]="width" [style.height.px]="minimized ? 52 : height"
     [style.left.px]="resizedPos ? resizedPos.left : null"
     [style.top.px]="resizedPos ? resizedPos.top : null"
     [style.right.px]="resizedPos ? null : 24"
     [style.bottom.px]="resizedPos ? null : 80">
  <div class="resize-grip resize-grip--tl" (mousedown)="onResizeStart($event, 'tl')"></div>
  <div class="resize-grip resize-grip--tr" (mousedown)="onResizeStart($event, 'tr')"></div>
  <div class="resize-grip resize-grip--bl" (mousedown)="onResizeStart($event, 'bl')"></div>
  <div class="resize-grip resize-grip--br" (mousedown)="onResizeStart($event, 'br')"></div>
  <div class="chat-header" [class.chat-header--flash]="headerFlash">
    <span class="partner-name" *ngIf="chatService.siteName$ | async as siteName; else chatFallback">Site: <strong>{{ siteName }}</strong></span>
    <ng-template #chatFallback><span class="partner-name">Chat</span></ng-template>
    <div class="header-actions">
      <button mat-icon-button (click)="minimize()" class="header-btn" title="Minimize">
        <mat-icon>{{ minimized ? 'expand_less' : 'remove' }}</mat-icon>
      </button>
      <button mat-icon-button (click)="close()" class="header-btn header-btn--close" title="Close">
        <mat-icon>close</mat-icon>
      </button>
    </div>
  </div>

  <ng-container *ngIf="!minimized">

    <div class="chat-search-bar">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input
        [(ngModel)]="chatSearch"
        placeholder="Search messages..."
        class="chat-search-input"
      />
      <button *ngIf="chatSearch" class="chat-search-clear" (click)="chatSearch = ''">&#10005;</button>
    </div>

    <!-- Messages -->
    <div class="messages-scroll-wrap" (contextmenu)="onContextMenu($event)">
      <div class="chat-context-menu" *ngIf="showContextMenu" [style.top.px]="contextMenuY" [style.left.px]="contextMenuX">
        <button class="chat-context-menu__item" (click)="clearChat()">Clear chat</button>
      </div>
      <button class="scroll-arrow scroll-arrow--top" (click)="scrollToTop()" title="Jump to top">&#9650;</button>
      <div class="messages-container" #messagesContainer>
        <div
          *ngFor="let msg of filteredMessages; trackBy: trackByUuid"
          [class.own]="isOwnMessage(msg)"
          [class.unread-bold]="unreadUuids.has(msg.uuid)"
          [class.bubble--note]="msg.kind === 'note'"
          [class.bubble--note-open]="msg.kind === 'note' && msg.status === 'open'"
          [class.bubble--note-resolved]="msg.kind === 'note' && msg.status === 'resolved'"
          [class.bubble--system]="msg.kind === 'system'"
          class="bubble"
          (contextmenu)="onMessageContextMenu($event, msg)"
        >
          <ng-container *ngIf="msg.kind === 'note'">
            <span class="bubble__field-tag" title="Reviewer note">📌 {{ fieldLabel(msg.fieldName) }}</span>
          </ng-container>
          <span class="sender-name">{{ msg.username }}</span>
          <span class="text" *ngIf="!isItalic(msg.chatEntry)" [innerHTML]="highlightText(msg.chatEntry)"></span>
          <span class="text text--italic" *ngIf="isItalic(msg.chatEntry)" [innerHTML]="highlightText(stripItalic(msg.chatEntry))"></span>
          <a *ngIf="reportLink(msg.chatEntry) as link"
             class="report-card"
             [href]="link.url"
             target="_blank"
             rel="noopener">
            <span class="report-card__icon">🛡️</span>
            <span class="report-card__body">
              <span class="report-card__title">Verification Report</span>
              <span class="report-card__sub">Tap to open</span>
            </span>
            <span class="report-card__arrow">›</span>
          </a>
          <span class="time">{{ msg.createdAt | date: 'd MMM, HH:mm' }}</span>
          <span *ngIf="msg.kind === 'note'" class="bubble__note-actions">
            <span *ngIf="msg.status === 'resolved'" class="bubble__status bubble__status--resolved">
              ✓ resolved{{ msg.resolvedBy ? ' by ' + msg.resolvedBy : '' }}
            </span>
            <ng-container *ngIf="canResolveNotes">
              <button *ngIf="msg.status === 'open'" type="button" class="bubble__resolve" (click)="resolveNote(msg.uuid)">Mark resolved</button>
              <button *ngIf="msg.status === 'resolved'" type="button" class="bubble__resolve bubble__resolve--reopen" (click)="reopenNote(msg.uuid)">Reopen</button>
            </ng-container>
          </span>
        </div>
        <div *ngIf="messages.length === 0" class="no-messages">
          No messages yet. Say hello!
        </div>
      </div>
      <button class="scroll-arrow scroll-arrow--bottom" (click)="scrollToBottom()" title="Jump to bottom">&#9660;</button>
    </div>

    <div class="input-bar input-bar--rich" *ngIf="!(chatService.readOnly$ | async)">
      <div class="input-kind-row">
        <label class="input-kind-pick">
          <input type="radio" name="kind" value="text" [(ngModel)]="draftKind" />
          Message
        </label>
        <label class="input-kind-pick" *ngIf="canResolveNotes">
          <input type="radio" name="kind" value="note" [(ngModel)]="draftKind" />
          Note for registrant
        </label>
        <select *ngIf="draftKind === 'note'" class="input-field-anchor" [(ngModel)]="draftFieldName">
          <option *ngFor="let opt of NOTE_FIELD_OPTIONS" [value]="opt.key">{{ opt.label }}</option>
        </select>
      </div>
      <div class="input-bar__row">
        <textarea
          #messageInput
          [(ngModel)]="draft"
          (keydown)="onInputKeydown($event)"
          (input)="autoResize($event.target)"
          [placeholder]="draftKind === 'note' ? 'What should the registrant fix?' : 'Type a message…'"
          class="message-input"
          rows="1"
        ></textarea>
        <button class="send-btn send-btn--svg" (click)="send()" [disabled]="!draft.trim()">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
    </div>

  </ng-container>

  <div class="chat-confirm-backdrop" *ngIf="showClearConfirm" (click)="cancelClear()" (keydown.enter)="cancelClear()" tabindex="0" role="button">
    <div class="chat-confirm" (click)="$event.stopPropagation()" (keydown.enter)="$event.stopPropagation()">
      <p class="chat-confirm__msg">Clear all messages in this chat?</p>
      <div class="chat-confirm__actions">
        <button class="chat-confirm__btn chat-confirm__btn--cancel" (click)="cancelClear()">Cancel</button>
        <button class="chat-confirm__btn chat-confirm__btn--clear" (click)="confirmClear()">Clear</button>
      </div>
    </div>
  </div>

  <!-- Right-click context menu intentionally empty for now — delete
       was removed 2026-05-11 (chat is eternal audit material). Will
       reappear with non-destructive options (reply / permalink). -->
</div>
